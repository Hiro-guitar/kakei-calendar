<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計">
<title>家計カレンダー</title>
<meta name="theme-color" content="#F3F5F7">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #F3F5F7; --card: #FFFFFF; --ink: #1B2430; --sub: #5A6472; --past: #6B7480; --line: #E6E9ED; --field: #CDD3DA;
    --in: #1D5FD1; --in-ink: #1D4FA8; --in-bg: #EEF3FC;
    --out: #C2410C; --out-ink: #A63A0B; --out-bg: #FCF0E8; --warn-ink: #7A2C08;
    --sun: #B4361A; --chip: #E3E7EC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'Zen Kaku Gothic New', -apple-system, 'Hiragino Sans', sans-serif;
    font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%;
  }
  button, input, select { font: inherit; color: inherit; }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 112px; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .02em; }
  h2 { margin: 0 4px; font-size: 16px; }
  .sub { font-size: 13px; color: var(--sub); }
  .card { background: var(--card); border-radius: 16px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .icon-btn { width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--chip); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .icon-btn:disabled { opacity: .5; }
  .summary { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .net { font-size: 34px; font-weight: 700; }
  .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .pill { border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
  .pill .k { font-size: 12px; } .pill .v { font-size: 18px; font-weight: 700; }
  .pill.in { background: var(--in-bg); color: var(--in-ink); }
  .pill.out { background: var(--out-bg); color: var(--out-ink); }
  .receipt { font-size: 13px; color: var(--sub); display: flex; justify-content: space-between; }
  .alert { background: var(--out-bg); border-radius: 16px; padding: 16px; display: flex; gap: 12px; color: var(--warn-ink); }
  .alert b { font-size: 15px; display: block; margin-bottom: 4px; }
  .alert span { font-size: 13px; }
  .ok { padding: 14px 16px; font-size: 14px; color: var(--sub); }
  .cal { padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; }
  .wd { font-size: 12px; color: var(--sub); }
  .day { height: 54px; border: 0; background: none; padding: 4px 0 0;
         display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; border-radius: 10px; }
  .day:disabled { cursor: default; }
  .day.sel { background: var(--bg); }
  .num { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 14px; border-radius: 15px; }
  .day.past .num { color: var(--past); }
  .day.today .num { background: var(--ink); color: #fff; font-weight: 700; }
  .dots { display: flex; gap: 4px; height: 7px; }
  .dot { width: 7px; height: 7px; border-radius: 4px; }
  .dot.in { background: var(--in); } .dot.out { background: var(--out); }
  .legend { display: flex; gap: 16px; justify-content: center; font-size: 12px; color: var(--sub); padding-top: 4px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; }
  .detail { border-top: 1px solid var(--line); margin-top: 4px; padding: 12px 4px 0; display: flex; flex-direction: column; gap: 2px; }
  .list { padding: 4px 16px; }
  .row { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .date { width: 48px; flex: none; text-align: center; padding-top: 4px; }
  .date .d { font-size: 20px; font-weight: 700; } .date .w { font-size: 11px; color: var(--sub); }
  .items { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0; }
  .items .note { font-size: 12px; color: var(--sub); padding-top: 4px; }
  .line { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px;
          width: 100%; min-height: 36px; padding: 4px 0; border: 0; background: none; text-align: left; cursor: pointer; }
  .line .acct { font-size: 12px; color: var(--sub); }
  .amt.in { color: var(--in-ink); font-weight: 700; } .amt.out { color: var(--out-ink); }
  .bal { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; padding: 12px 0;
         border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
  .bal:last-child { border-bottom: 0; }
  .bal .name { display: flex; flex-direction: column; font-size: 14px; }
  .bal .v { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .empty { padding: 16px 0; font-size: 14px; color: var(--sub); }
  .status { padding: 64px 8px; text-align: center; color: var(--sub); font-size: 15px; line-height: 1.7; }
  .preview { font-size: 12px; color: var(--sub); background: var(--chip); border-radius: 999px; padding: 4px 10px; }

  .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom));
         height: 52px; padding: 0 24px; border: 0; border-radius: 26px; background: var(--ink); color: #fff;
         font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer;
         box-shadow: 0 6px 20px rgba(27, 36, 48, .25); }

  .backdrop { position: fixed; inset: 0; background: rgba(20, 26, 34, .45); }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; max-height: 92vh; overflow-y: auto;
           background: var(--card); border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
           display: flex; flex-direction: column; gap: 16px; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; }
  .sheet-head h3 { margin: 0; font-size: 18px; }
  .close { width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-right: -10px; }
  form { display: flex; flex-direction: column; gap: 16px; margin: 0; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label, .field > .lbl { font-size: 13px; color: var(--sub); }
  .field input, .field select { width: 100%; font-size: 16px; padding: 12px; border: 1px solid var(--field); border-radius: 10px; background: #fff; min-height: 48px; }
  .seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .seg label { position: relative; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .seg span { display: flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 10px;
              border: 1px solid var(--field); font-size: 15px; }
  .seg input:checked + span { border-color: var(--ink); background: var(--ink); color: #fff; font-weight: 700; }
  .seg input:focus-visible + span { outline: 2px solid var(--in); outline-offset: 2px; }
  .hidden { display: none !important; }
  .err { color: #9A2A0A; font-size: 14px; min-height: 0; }
  .primary { min-height: 52px; border: 0; border-radius: 12px; background: var(--ink); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
  .primary:disabled, .danger:disabled { opacity: .55; }
  .danger { min-height: 52px; border-radius: 12px; border: 1px solid #C8A99A; background: #fff; color: #9A2A0A; font-size: 16px; font-weight: 700; cursor: pointer; }
  .danger.confirm { background: #9A2A0A; border-color: #9A2A0A; color: #fff; }
  .big { font-size: 30px; font-weight: 700; }
  .meta { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .meta div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding: 8px 0; }
  .meta div span:first-child { color: var(--sub); }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom));
           background: var(--ink); color: #fff; border-radius: 999px; padding: 10px 18px; font-size: 14px; }
</style>
</head>
<body>
<main id="app"></main>
<button type="button" class="fab hidden" id="fab">
  <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  予定を追加
</button>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const yen = n => '¥' + Math.abs(Math.round(n)).toLocaleString('ja-JP');
  const signed = n => (n >= 0 ? '+' : '−') + yen(n);
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parse = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const md = s => { const d = parse(s); return (d.getMonth() + 1) + '/' + d.getDate(); };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const toNum = s => Number(String(s).replace(/[,，¥￥円\s]/g, ''));

  const ICON_X = '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const ICON_EDIT = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B7480" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>';

  /* ---------- データ ---------- */

  function sampleData() {
    const t = new Date();
    const y = t.getFullYear(), m = t.getMonth();
    const at = (mm, d) => ymd(new Date(y, mm, d));
    return {
      today: ymd(t), year: y, month: m + 1, key: '',
      summary: { income: 420000, expense: 282000, net: 138000 },
      receipts: 62890,
      alerts: [{ account: '三菱UFJ', date: at(m, 27), need: 48000, outTotal: 230000, balance: 182000 }],
      events: [
        { date: at(m, 5), label: 'エポスカード', account: '三菱UFJ', amount: -21000, row: 3, recurring: false },
        { date: at(m, 10), label: '児童手当', account: '三菱UFJ', amount: 30000, row: 4, recurring: false },
        { date: at(m, 27), label: '楽天カード', account: '三菱UFJ', amount: -98000, row: 5, recurring: false },
        { date: at(m, 27), label: 'PayPayカード', account: '三菱UFJ', amount: -41000, row: 6, recurring: false },
        { date: at(m, 27), label: '家賃', account: '三菱UFJ', amount: -68000, row: 2, recurring: true },
        { date: at(m, 28), label: '事業収入', account: 'GMOあおぞら', amount: 240000, row: 7, recurring: false },
        { date: at(m + 1, 4), label: 'セゾンカード', account: '三菱UFJ', amount: -52000, row: 8, recurring: false },
      ],
      balances: [
        { account: '三菱UFJ', amount: 182000, note: '引き落とし用', updated: ymd(t) },
        { account: 'GMOあおぞら', amount: 310000, note: '事業収入', updated: ymd(t) },
        { account: '三井住友', amount: null, note: '', updated: '' },
        { account: 'みずほ', amount: null, note: '', updated: '' },
      ],
      accounts: ['三菱UFJ', 'GMOあおぞら', '三井住友', 'みずほ'],
    };
  }

  // データの読み書きは Apps Script（家計簿）が受け持つ
  const API = 'https://script.google.com/macros/s/AKfycbwrlYmmsazBkvLdp8SY5Rd0x1ohkUGfZ8y0EK4AFDdPUpGuA0bHa6QqjB6nE8jkKv83/exec';

  // 合い言葉は URL の #k=... に入っている（# 以降はどこにも送られない）
  function readKey() {
    const m = location.hash.match(/k=([0-9a-zA-Z]+)/);
    let k = m ? m[1] : '';
    try {
      if (k) localStorage.setItem('kakei-key', k);
      else k = localStorage.getItem('kakei-key') || '';
    } catch (e) { /* 保存できなくても URL の合い言葉で動く */ }
    return k;
  }

  const PREVIEW = /[?&]demo\b/.test(location.search);
  const KEY = PREVIEW ? '' : readKey();
  let DATA = null;
  let selected = null;

  function setData(d) {
    DATA = d;
    document.getElementById('fab').classList.toggle('hidden', !!document.querySelector('.sheet'));
    render();
  }

  async function api(payload) {
    const res = payload
      ? await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      : await fetch(API + '?api=1&k=' + encodeURIComponent(KEY), { cache: 'no-store' });
    if (!res.ok) throw new Error('通信に失敗しました（' + res.status + '）');
    let j;
    try { j = await res.json(); } catch (e) { throw new Error('サーバーの返事が読めませんでした'); }
    if (!j.ok) throw new Error(j.error || 'エラーが起きました');
    return j.data;
  }

  const FN = { apiGetData: 'get', apiAddSchedule: 'add', apiDeleteSchedule: 'del', apiSetBalance: 'bal' };

  function call(fn, args, done, fail) {
    if (PREVIEW) { fail('サンプル表示なので保存できません'); return; }
    api({ k: KEY, fn: FN[fn], args: args }).then(done, e => fail(e && e.message ? e.message : String(e)));
  }

  function showStatus(msg) {
    document.getElementById('app').innerHTML = '<div class="status">' + esc(msg) + '</div>';
  }

  /* ---------- メイン画面 ---------- */

  function lineHtml(ev, showAccount) {
    const cls = ev.amount > 0 ? 'in' : 'out';
    return '<button type="button" class="line" data-ev="' + ev._i + '"><span>' + esc(ev.label) +
      (showAccount && ev.account ? ' <span class="acct">' + esc(ev.account) + '</span>' : '') +
      '</span><span class="amt ' + cls + '">' + signed(ev.amount) + '</span></button>';
  }

  function render() {
    DATA.events.forEach((e, i) => { e._i = i; });
    const byDate = {};
    DATA.events.forEach(ev => (byDate[ev.date] = byDate[ev.date] || []).push(ev));
    const todayD = parse(DATA.today);
    const s = DATA.summary;
    let h = '';

    h += '<div class="head"><div><div class="sub">今日 ' + md(DATA.today) + '（' + WD[todayD.getDay()] + '）</div>' +
         '<h1>' + DATA.year + '年' + DATA.month + '月</h1></div>' +
         (PREVIEW ? '<span class="preview">サンプル表示</span>' :
           '<button type="button" class="icon-btn" id="refresh" aria-label="最新にする">' +
           '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>') +
         '</div>';

    h += '<section class="card summary"><div><div class="sub">今月の収支</div>' +
         '<div class="net" style="color:' + (s.net >= 0 ? 'var(--in)' : 'var(--out-ink)') + '">' + signed(s.net) + '</div></div>' +
         '<div class="pair"><div class="pill in"><span class="k">収入</span><span class="v">' + yen(s.income) + '</span></div>' +
         '<div class="pill out"><span class="k">支出</span><span class="v">' + yen(s.expense) + '</span></div></div>' +
         (DATA.receipts !== null && DATA.receipts !== undefined ? '<div class="receipt"><span>レシートで記録した今月の買い物</span><span>' + yen(DATA.receipts) + '</span></div>' : '') +
         '</section>';

    if (DATA.alerts.length) {
      DATA.alerts.forEach(a => {
        h += '<section class="alert"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="9"/><path d="M12 7v6"/><path d="M12 16.5v.5"/></svg>' +
             '<div><b>' + md(a.date) + 'の引き落としまでに、' + esc(a.account) + 'に ' + yen(a.need) + ' 入れておく</b>' +
             '<span>引き落とし ' + yen(a.outTotal) + ' ／ 今の残高 ' + yen(a.balance) + '</span></div></section>';
      });
    } else if (DATA.balances.some(b => b.amount !== null)) {
      h += '<section class="card ok">しばらく残高は足りています</section>';
    }

    // カレンダー
    const first = new Date(DATA.year, DATA.month - 1, 1);
    const days = new Date(DATA.year, DATA.month, 0).getDate();
    h += '<section class="card cal"><div class="grid">' +
         WD.map((w, i) => '<div class="wd" style="' + (i === 0 ? 'color:var(--sun)' : i === 6 ? 'color:var(--in)' : '') + '">' + w + '</div>').join('') +
         '</div><div class="grid">';
    for (let i = 0; i < first.getDay(); i++) h += '<div></div>';
    for (let d = 1; d <= days; d++) {
      const key = DATA.year + '-' + pad(DATA.month) + '-' + pad(d);
      const evs = byDate[key] || [];
      const cls = ['day'];
      if (d === todayD.getDate()) cls.push('today'); else if (d < todayD.getDate()) cls.push('past');
      if (selected === key) cls.push('sel');
      h += '<button type="button" class="' + cls.join(' ') + '" data-day="' + key + '"' + (evs.length ? '' : ' disabled') +
           ' aria-label="' + DATA.month + '月' + d + '日' + (evs.length ? '、予定' + evs.length + '件' : '') + '">' +
           '<span class="num">' + d + '</span><span class="dots">' +
           (evs.some(e => e.amount > 0) ? '<span class="dot in"></span>' : '') +
           (evs.some(e => e.amount < 0) ? '<span class="dot out"></span>' : '') +
           '</span></button>';
    }
    h += '</div><div class="legend"><span><i style="background:var(--in)"></i>入金予定</span><span><i style="background:var(--out)"></i>引き落とし</span></div>';
    if (selected && byDate[selected]) {
      h += '<div class="detail"><div class="sub">' + md(selected) + '（' + WD[parse(selected).getDay()] + '）</div>' +
           byDate[selected].map(ev => lineHtml(ev, true)).join('') + '</div>';
    }
    h += '</section>';

    // これからの予定
    const upcoming = Object.keys(byDate).filter(k => k >= DATA.today).sort();
    h += '<h2>これからの予定</h2><section class="card list">';
    if (!upcoming.length) h += '<div class="empty">予定はまだありません。下の「予定を追加」から入れてください</div>';
    upcoming.forEach(k => {
      const d = parse(k);
      const evs = byDate[k];
      const accts = [...new Set(evs.map(e => e.account).filter(Boolean))];
      const allOut = evs.every(e => e.amount < 0), allIn = evs.every(e => e.amount > 0);
      const note = accts.length === 1 ? accts[0] + (allOut ? 'から引き落とし' : allIn ? 'に入金' : '') : '';
      const dLabel = d.getMonth() + 1 === DATA.month ? String(d.getDate()) : (d.getMonth() + 1) + '/' + d.getDate();
      h += '<div class="row"><div class="date"><div class="d">' + dLabel + '</div><div class="w">' + WD[d.getDay()] + '</div></div>' +
           '<div class="items">' + (note ? '<div class="note">' + esc(note) + '</div>' : '') +
           evs.map(e => lineHtml(e, !note)).join('') + '</div></div>';
    });
    h += '</section>';

    // 口座残高
    h += '<h2>口座残高</h2><section class="card list">';
    if (!DATA.balances.length) h += '<div class="empty">口座がまだありません</div>';
    DATA.balances.forEach((b, i) => {
      h += '<button type="button" class="bal" data-bal="' + i + '"><span class="name"><span>' + esc(b.account) + '</span>' +
           '<span class="sub" style="font-size:12px">' + esc([b.note, b.updated ? md(b.updated) + '時点' : 'タップして残高を入れる'].filter(Boolean).join('・')) + '</span></span>' +
           '<span class="v">' + (b.amount === null ? '—' : yen(b.amount)) + ICON_EDIT + '</span></button>';
    });
    h += '</section>';

    document.getElementById('app').innerHTML = h;
  }

  /* ---------- 下から出るパネル ---------- */

  function openSheet(title, body) {
    document.getElementById('sheet-root').innerHTML =
      '<div class="backdrop" data-close="1"></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<div class="sheet-head"><h3>' + esc(title) + '</h3><button type="button" class="close" data-close="1" aria-label="閉じる">' + ICON_X + '</button></div>' +
      body + '</div>';
    document.getElementById('fab').classList.add('hidden');
    const f = document.querySelector('.sheet input:not([type=radio]), .sheet button.primary, .sheet button.danger');
    if (f && f.tagName === 'INPUT' && f.type !== 'date') f.focus();
  }

  function closeSheet() {
    document.getElementById('sheet-root').innerHTML = '';
    document.getElementById('fab').classList.remove('hidden');
  }

  function toast(msg) {
    const root = document.getElementById('toast-root');
    root.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { root.innerHTML = ''; }, 2200);
  }

  function showErr(msg) {
    const el = document.querySelector('.sheet .err');
    if (el) el.textContent = msg;
  }

  function busy(btn, on, label) {
    btn.disabled = on;
    if (on) { btn.dataset.label = btn.textContent; btn.textContent = label || '保存中…'; }
    else if (btn.dataset.label) btn.textContent = btn.dataset.label;
  }

  function openAdd() {
    const labels = [...new Set(DATA.events.map(e => e.label))];
    const accts = DATA.accounts && DATA.accounts.length ? DATA.accounts : DATA.balances.map(b => b.account);
    let dayOpts = '';
    for (let d = 1; d <= 31; d++) dayOpts += '<option value="' + d + '"' + (d === 27 ? ' selected' : '') + '>' + d + '日</option>';
    dayOpts += '<option value="末">月末</option>';

    openSheet('予定を追加',
      '<form id="add-form" novalidate>' +
      '<div class="field"><span class="lbl">種類</span><div class="seg">' +
        '<label><input type="radio" name="kind" value="引き落とし" checked><span>引き落とし・支払い</span></label>' +
        '<label><input type="radio" name="kind" value="入金"><span>入金</span></label></div></div>' +
      '<div class="field"><label for="f-label">項目</label>' +
        '<input id="f-label" name="label" type="text" list="dl-labels" placeholder="例：楽天カード、家賃、事業収入" autocomplete="off" required>' +
        '<datalist id="dl-labels">' + labels.map(l => '<option value="' + esc(l) + '"></option>').join('') + '</datalist></div>' +
      '<div class="field"><label for="f-amount">金額（円）</label>' +
        '<input id="f-amount" name="amount" type="text" inputmode="numeric" placeholder="例：98000" autocomplete="off" required></div>' +
      '<div class="field"><span class="lbl">いつ</span><div class="seg">' +
        '<label><input type="radio" name="when" value="once" checked><span>この日だけ</span></label>' +
        '<label><input type="radio" name="when" value="monthly"><span>毎月</span></label></div>' +
        '<input id="f-date" name="date" type="date" value="' + DATA.today + '" aria-label="日付">' +
        '<select id="f-day" name="day" class="hidden" aria-label="毎月の日にち">' + dayOpts + '</select>' +
        '<div class="sub hidden" id="f-day-note"></div></div>' +
      '<div class="field"><label for="f-account">口座</label>' +
        '<input id="f-account" name="account" type="text" list="dl-accts" value="' + esc(accts[0] || '') + '" autocomplete="off">' +
        '<datalist id="dl-accts">' + accts.map(a => '<option value="' + esc(a) + '"></option>').join('') + '</datalist></div>' +
      '<div class="err" role="alert"></div>' +
      '<button type="submit" class="primary">追加する</button>' +
      '</form>');

    const form = document.getElementById('add-form');
    const note = document.getElementById('f-day-note');
    note.classList.add('hidden');
    form.addEventListener('change', e => {
      if (e.target.name !== 'when') return;
      const monthly = e.target.value === 'monthly';
      document.getElementById('f-date').classList.toggle('hidden', monthly);
      document.getElementById('f-day').classList.toggle('hidden', !monthly);
      note.textContent = '土日・祝日のときは次の平日に表示します';
      note.classList.toggle('hidden', !monthly);
    });
    form.addEventListener('submit', e => {
      e.preventDefault();
      const f = new FormData(form);
      const amount = toNum(f.get('amount'));
      if (!String(f.get('label')).trim()) { showErr('項目を入れてください'); return; }
      if (!amount || amount < 0) { showErr('金額を数字で入れてください'); return; }
      const monthly = f.get('when') === 'monthly';
      if (!monthly && !f.get('date')) { showErr('日付を選んでください'); return; }
      const item = {
        kind: f.get('kind'), label: f.get('label'), amount: amount, account: f.get('account'),
        repeat: monthly, date: f.get('date'), repeatDay: f.get('day'),
      };
      const btn = form.querySelector('.primary');
      busy(btn, true);
      showErr('');
      call('apiAddSchedule', [item],
        d => { setData(d); closeSheet(); toast('追加しました'); },
        msg => { busy(btn, false); showErr(msg); });
    });
  }

  function openEvent(ev) {
    const d = parse(ev.date);
    openSheet(ev.label,
      '<div class="big" style="color:' + (ev.amount > 0 ? 'var(--in-ink)' : 'var(--out-ink)') + '">' + signed(ev.amount) + '</div>' +
      '<div class="meta">' +
        '<div><span>日付</span><span>' + (d.getMonth() + 1) + '月' + d.getDate() + '日（' + WD[d.getDay()] + '）</span></div>' +
        '<div><span>種類</span><span>' + (ev.amount > 0 ? '入金' : '引き落とし・支払い') + '</span></div>' +
        (ev.account ? '<div><span>口座</span><span>' + esc(ev.account) + '</span></div>' : '') +
        (ev.recurring ? '<div><span>くり返し</span><span>毎月</span></div>' : '') +
      '</div>' +
      (ev.recurring ? '<div class="sub">毎月の予定なので、削除するとほかの月からも消えます</div>' : '') +
      '<div class="err" role="alert"></div>' +
      '<button type="button" class="danger" id="del-btn">削除する</button>');

    const btn = document.getElementById('del-btn');
    btn.addEventListener('click', () => {
      if (!btn.classList.contains('confirm')) {
        btn.classList.add('confirm');
        btn.textContent = 'もう一度押すと削除します';
        return;
      }
      busy(btn, true, '削除中…');
      call('apiDeleteSchedule', [ev.row, ev.label, ev.amount],
        d => { setData(d); closeSheet(); toast('削除しました'); },
        msg => { busy(btn, false); showErr(msg); });
    });
  }

  function openBalance(b) {
    openSheet(b.account + 'の残高',
      '<form id="bal-form" novalidate>' +
      '<div class="field"><label for="f-bal">今の残高（円）</label>' +
        '<input id="f-bal" name="amount" type="text" inputmode="numeric" value="' + (b.amount === null ? '' : Math.round(b.amount)) + '" placeholder="例：182000" autocomplete="off"></div>' +
      '<div class="sub">' + (b.updated ? '前回の更新：' + md(b.updated) + '。' : '') + '保存すると今日の日付で記録します</div>' +
      '<div class="err" role="alert"></div>' +
      '<button type="submit" class="primary">保存する</button>' +
      '</form>');

    const form = document.getElementById('bal-form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      const raw = document.getElementById('f-bal').value;
      const v = toNum(raw);
      if (String(raw).trim() === '' || isNaN(v)) { showErr('残高を数字で入れてください'); return; }
      const btn = form.querySelector('.primary');
      busy(btn, true);
      showErr('');
      call('apiSetBalance', [b.account, v],
        d => { setData(d); closeSheet(); toast('残高を更新しました'); },
        msg => { busy(btn, false); showErr(msg); });
    });
  }

  function refresh(btn) {
    btn.disabled = true;
    call('apiGetData', [],
      d => { setData(d); toast('最新にしました'); },
      msg => { btn.disabled = false; toast(msg); });
  }

  /* ---------- 操作 ---------- */

  document.addEventListener('click', e => {
    const t = e.target.closest('button, .backdrop');
    if (!t) return;
    if (t.dataset.close) { closeSheet(); return; }
    if (t.id === 'fab') { openAdd(); return; }
    if (t.id === 'refresh') { refresh(t); return; }
    if (t.dataset.day) { selected = selected === t.dataset.day ? null : t.dataset.day; render(); return; }
    if (t.dataset.ev !== undefined) { openEvent(DATA.events[Number(t.dataset.ev)]); return; }
    if (t.dataset.bal !== undefined) { openBalance(DATA.balances[Number(t.dataset.bal)]); return; }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.querySelector('.sheet')) closeSheet();
  });

  // アプリに戻ってきたら最新にする（もうひとりが入れた分を反映）
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !DATA || PREVIEW || document.querySelector('.sheet')) return;
    api().then(setData).catch(() => {});
  });

  if (PREVIEW) {
    setData(sampleData());
  } else if (!KEY) {
    showStatus('合い言葉の付いたURLから開いてください。');
  } else {
    showStatus('読み込み中…');
    api().then(setData, e => showStatus('読み込めませんでした。' + (e && e.message ? e.message : '') + ' 少し待ってから開き直してください。'));
  }
</script>
</body>
</html>
