<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="献立">
<meta name="robots" content="noindex">
<title>献立カレンダー</title>
<link rel="apple-touch-icon" href="kondate-icon.png">
<link rel="icon" href="kondate-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: sticky tab bar → one view at a time (calendar+day card / log / recipe list / plan) */
:root{
  --bg:#f6f7f4; --surface:#ffffff; --ink:#1f2a24; --muted:#66736b; --line:#dfe4de;
  --leaf:#2f6b4f; --leaf-soft:#e3efe8; --ice:#b0527a; --ice-soft:#f7e6ee; --treat:#a8761c; --warn:#b5651d; --warn-soft:#faeedd;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1c2420; --ink:#e7ece8; --muted:#9aa8a0; --line:#2e3a34;
  --leaf:#7cc4a0; --leaf-soft:#22362c; --ice:#e48fb3; --ice-soft:#3a2430; --treat:#e0b25a; --warn:#e3a35f; --warn-soft:#3a2d1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1c2420; --ink:#e7ece8; --muted:#9aa8a0; --line:#2e3a34;
  --leaf:#7cc4a0; --leaf-soft:#22362c; --ice:#e48fb3; --ice-soft:#3a2430; --treat:#e0b25a; --warn:#e3a35f; --warn-soft:#3a2d1c; color-scheme:dark}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding-block:16px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
header h1{font-family:var(--display);font-weight:700;font-size:1.55rem;margin:0;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
nav.views{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.views a{flex:none;text-decoration:none;color:var(--ink);font-weight:500;padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.views a[aria-current="page"]{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
h2{font-family:var(--display);font-size:1.25rem;margin:0}
h3{font-size:1rem;margin:0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.status{font-size:.8rem;color:var(--muted)}
/* calendar */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.phase{font-size:.85rem;color:var(--muted);margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:.75rem;color:var(--muted);text-align:center;letter-spacing:.05em}
.dow.sun{color:var(--ice)}
.cell{min-height:96px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 6px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell.empty{background:transparent;border-color:transparent;cursor:default}
.cell.off{cursor:default;opacity:.5}
.cell.sel{border-color:var(--leaf);box-shadow:inset 0 0 0 1px var(--leaf)}
.cell .d{font-weight:700;font-variant-numeric:tabular-nums;font-size:.85rem;display:flex;justify-content:space-between;align-items:center;gap:4px}
.cell.today .d span:first-child{background:var(--leaf);color:var(--bg);border-radius:999px;padding:0 6px}
.ice-dot{width:7px;height:7px;border-radius:50%;background:var(--ice);flex:none;display:inline-block}
.cell .m{font-size:.7rem;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.cell .m b{font-weight:500;color:var(--muted);margin-right:2px}
.cell .note{font-size:.68rem;color:var(--muted)}
.prog{margin-top:auto;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--leaf)}
@media (max-width:560px){.cell{min-height:54px}.cell .m{display:none}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:14px}
.daycard{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px)}
@media (max-width:860px){.daycard{position:static}}
.sub{font-size:.82rem;color:var(--muted);margin-top:2px}
.chip{display:inline-block;font-size:.78rem;padding:2px 10px;border-radius:999px;font-weight:500}
.chip.ice{background:var(--ice-soft);color:var(--ice)}
.chip.yog{background:var(--leaf-soft);color:var(--leaf)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.meal h3{font-size:.85rem;margin:0 0 6px;display:flex;justify-content:space-between;color:var(--muted);font-weight:500;letter-spacing:.06em}
.meal ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.meal li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:5px}
.meal li:last-child{border-bottom:0}
a.rec{color:var(--leaf);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.plain{font-weight:700}
.kob{font-size:.68rem;font-weight:500;color:var(--leaf);border:1px solid var(--leaf);border-radius:4px;padding:0 4px;margin-right:4px;vertical-align:1px}
.amt{font-size:.8rem;color:var(--muted);text-align:right;flex:none;max-width:52%}
.src{font-size:.68rem;color:var(--muted);margin-left:4px;font-weight:400}
.treat{color:var(--treat)}
.free{background:var(--bg);border-radius:8px;padding:8px 10px}
.free p{margin:0 0 4px;font-size:.88rem}
.free ul{margin:0;padding-left:1.1em;display:grid;gap:2px}
.total span:last-child{white-space:nowrap}
.total{display:flex;gap:8px;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums;border-top:1px solid var(--line);padding-top:10px}
.nut{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.nut div{background:var(--bg);border-radius:8px;padding:6px 8px}
.nut b{display:block;font-variant-numeric:tabular-nums;font-size:.95rem}
.nut span{font-size:.7rem;color:var(--muted)}
.nut .low b{color:var(--warn)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.checks label{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:.9rem}
.checks input{width:18px;height:18px;accent-color:var(--leaf);flex:none}
textarea{font:inherit;width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:8px;min-height:56px;resize:vertical}
.kcal{font-variant-numeric:tabular-nums}
/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;color:var(--muted);font-weight:500;letter-spacing:.04em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.section{display:grid;gap:10px}
.prose{max-width:68ch;display:grid;gap:8px}
.prose p{margin:0}
.prose ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat div{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=number],input[type=date]{font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:6px 8px}
input[type=number]{width:7em}
button.btn{font:inherit;font-weight:500;border:0;border-radius:8px;background:var(--leaf);color:var(--bg);padding:7px 16px;cursor:pointer}
button.link{font:inherit;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.ms label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.ms input{width:18px;height:18px;margin-top:3px;accent-color:var(--leaf);flex:none}
.spark{width:100%;height:160px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>献立カレンダー</h1>
<p>2026年11月1日〜2027年2月28日。毎日の献立・チェック・記録・料理リスト・計画をここでまとめて見られます。</p>
</header>
<nav class="views" aria-label="ページの切り替え">
<a href="#calendar" data-v="calendar">カレンダー</a>
<a href="#log" data-v="log">記録</a>
<a href="#recipes" data-v="recipes">料理リスト</a>
<a href="#plan" data-v="plan">計画</a>
</nav>

<section id="v-calendar" class="view">
<div class="tabs" id="mtabs" role="group" aria-label="月"></div>
<div class="main">
<div>
<p class="phase" id="phase"></p>
<div class="grid" id="grid"></div>
<div class="legend"><span><i class="ice-dot"></i>アイスの日</span><span>★ ご褒美の日（1月からは土曜）</span><span><i class="prog" style="width:22px;display:inline-block;margin:0"><i style="width:60%"></i></i>その日のチェックの進み具合</span></div>
</div>
<aside class="card daycard" id="card" aria-live="polite"></aside>
</div>
</section>

<section id="v-log" class="view" hidden></section>
<section id="v-recipes" class="view" hidden></section>
<section id="v-plan" class="view" hidden></section>
<p class="status" id="store"></p>
</div>

/* ---- 保存：チェックとメモはスプレッドシート（Apps Script）へ。体重はこのスマホだけ ---- */
// Apps Script をデプロイしたら、その URL をここに入れる
const API='https://script.google.com/macros/s/AKfycbyoXqmTlAHWGtf7B9ofgI98MlRr4tRAQTj-0QRD9IjXIdsmtWijtM0fcg_SfWWL_kOq/exec';
const state={days:{},ms:{},weights:{},mode:'local',readOnly:false};
function lsGet(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
state.days=lsGet('kondate-days',{});state.ms=lsGet('kondate-ms',{});state.weights=lsGet('kondate-w',{});
// 合い言葉は URL の #k=... に入っている（# 以降はどこにも送られない）
function readKey(){const m=location.hash.match(/k=([0-9a-zA-Z]+)/);let k=m?m[1]:'';try{if(k)localStorage.setItem('kondate-key',k);else k=localStorage.getItem('kondate-key')||''}catch(e){}return k}
const KEY=readKey();
function storeNote(){
  const el=document.getElementById('store');
  el.textContent=state.mode==='sheet'?'チェックとメモは2人で共有されます。体重メモは、入力したスマホにだけ保存されます。':state.mode==='error'?'記録の読み込みに失敗しました。チェックはいったんこのスマホにだけ保存されます。':'チェックとメモは、このスマホにだけ保存されています（共有用の合い言葉付きURLで開くと2人で共有されます）。';
}
async function api(payload){
  const res=payload?await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}):await fetch(API+'?api=1&k='+encodeURIComponent(KEY),{cache:'no-store'});
  if(!res.ok)throw new Error('通信に失敗しました（'+res.status+'）');
  const j=await res.json(); if(!j.ok)throw new Error(j.error||'エラー'); return j.data;
}
async function initDb(){
  if(!API||!KEY)return;
  try{const d=await api();state.days=d.days||{};state.ms=d.ms||{};state.mode='sheet';lsSet('kondate-days',state.days);lsSet('kondate-ms',state.ms)}
  catch(e){state.mode='error'}
  storeNote();rerender();
}
async function saveDay(k,obj){
  state.days={...state.days,[k]:obj};lsSet('kondate-days',state.days);
  if(state.mode==='sheet'){try{await api({k:KEY,fn:'day',args:[k,obj]})}catch(e){state.mode='error';storeNote()}}
}
async function saveMs(obj){
  state.ms=obj;lsSet('kondate-ms',obj);
  if(state.mode==='sheet'){try{await api({k:KEY,fn:'ms',args:[obj]})}catch(e){state.mode='error';storeNote()}}
}
async function saveW(obj){state.weights=obj;lsSet('kondate-w',obj)}

function spark(ws){
  const W_=600,H_=160,P=28;const t0=new Date(ws[0][0]).getTime(),t1=new Date(ws[ws.length-1][0]).getTime()||t0+1;
  const vs=ws.map(x=>+x[1]);let lo=Math.floor(Math.min(...vs)-1),hi=Math.ceil(Math.max(...vs)+1);
  const X=t=>P+(W_-2*P)*((t-t0)/((t1-t0)||1)),Y=v=>H_-P+( -(H_-2*P)*(v-lo)/(hi-lo));
  const pts=ws.map(([d,v])=>X(new Date(d).getTime()).toFixed(1)+','+Y(+v).toFixed(1)).join(' ');
  const last=ws[ws.length-1];
  return '<svg class="spark" viewBox="0 0 '+W_+' '+H_+'" role="img" aria-label="体重の推移"><line x1="'+P+'" x2="'+(W_-P)+'" y1="'+Y(lo)+'" y2="'+Y(lo)+'" stroke="var(--line)"/><line x1="'+P+'" x2="'+(W_-P)+'" y1="'+Y(hi)+'" y2="'+Y(hi)+'" stroke="var(--line)"/><text x="4" y="'+(Y(hi)+4)+'" font-size="11" fill="var(--muted)">'+hi+'</text><text x="4" y="'+(Y(lo)+4)+'" font-size="11" fill="var(--muted)">'+lo+'</text><polyline points="'+pts+'" fill="none" stroke="var(--leaf)" stroke-width="2"/><circle cx="'+X(new Date(last[0]).getTime())+'" cy="'+Y(+last[1])+'" r="4" fill="var(--leaf)"/></svg>';
}
