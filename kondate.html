<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="献立">
<link rel="apple-touch-icon" href="kondate-icon.png">
<title>献立</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f8f1e4; --surface:#fffbf3; --ink:#3b2f28; --muted:#8a776a; --line:#e6d8c3;
  --leaf:#b5573c; --leaf-soft:#f6e3d8; --olive:#6d7a3c; --olive-soft:#ebeed9; --sun:#c08a2c; --sun-soft:#f7ead0;
  --dot:rgba(120,90,60,.13);
  --display:"Klee One","Hiragino Mincho ProN","Noto Serif JP",serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#231b16; --surface:#2d241e; --ink:#f1e6d8; --muted:#b6a493; --line:#45372d;
  --leaf:#e38d6c; --leaf-soft:#4a2c21; --olive:#b4c27a; --olive-soft:#343722; --sun:#e3b866; --sun-soft:#43361f; --dot:rgba(255,235,210,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#231b16; --surface:#2d241e; --ink:#f1e6d8; --muted:#b6a493; --line:#45372d;
  --leaf:#e38d6c; --leaf-soft:#4a2c21; --olive:#b4c27a; --olive-soft:#343722; --sun:#e3b866; --sun-soft:#43361f; --dot:rgba(255,235,210,.06); color-scheme:dark}
html{-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.4px);background-size:18px 18px;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;padding:max(12px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.4}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:16px}
nav.views{display:flex;gap:8px;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
nav.views a{flex:1;text-align:center;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:600;border:1px solid var(--line);border-radius:999px;padding:6px 0;background:var(--surface)}
nav.views a[aria-current="page"]{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav h2{font-size:1.15rem;display:flex;align-items:center;gap:8px}
.tag{font-family:var(--body);font-size:.72rem;font-weight:500;color:var(--olive);border:1px solid var(--olive);border-radius:999px;padding:0 8px}
.navb{font-size:1.4rem;line-height:1;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.navb:disabled{opacity:.3;cursor:default}
.link{background:none;border:0;padding:0;color:var(--leaf);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.small{font-size:.82rem}.muted{color:var(--muted)}
.tonight .lead{font-family:var(--display);color:var(--leaf);margin:0}
.tonight .dish{font-family:var(--display);font-weight:600;font-size:clamp(1.4rem,6vw,1.8rem);line-height:1.35;margin:0;text-wrap:balance}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.meal header{display:flex;align-items:baseline;gap:10px}
.meal header h3{font-size:1.05rem;flex:1}
.meal header .kc{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px}
.b-b{background:var(--sun)}.b-l{background:var(--olive)}.b-d{background:var(--leaf)}
.dishes{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.dishes li{display:flex;gap:8px;align-items:baseline}
.dishes .amt{margin-left:auto;font-size:.8rem;color:var(--muted);white-space:nowrap}
.rb{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;font-weight:500}
.who{display:grid;gap:4px;border-top:1px dashed var(--line);padding-top:8px;font-size:.88rem}
.who div{display:grid;grid-template-columns:4.2em 1fr;gap:6px}
.who b{font-weight:500;color:var(--muted)}
.make{font-size:.85rem;background:var(--leaf-soft);border-radius:8px;padding:6px 10px}
.kid{font-size:.82rem;color:var(--muted)}
.kid::before{content:"子ども　";color:var(--leaf)}
.sum{background:var(--olive-soft);border-radius:12px;padding:12px 16px;display:grid;gap:6px}
.sum .row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--olive)}
.sum p{margin:0;font-size:.82rem}
/* calendar */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:.75rem;color:var(--muted)}
.cell{min-height:74px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cell.empty{background:none;border:0;cursor:default}
.cell.off{opacity:.35;cursor:default}
.cell.today{border-color:var(--olive);border-width:2px}
.cell .d{font-size:.75rem;color:var(--muted)}
.cell .m{font-size:.68rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* recipes */
.rlist{display:grid;gap:14px}
.rlist h2{font-size:1.1rem}
.rlist ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.rlist li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(30,20,10,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-in{background:var(--surface);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));display:grid;gap:12px}
.sheet-in h2{font-size:1.25rem}
.sheet-in table{width:100%;border-collapse:collapse;font-size:.92rem}
.sheet-in td{border-bottom:1px solid var(--line);padding:5px 0}
.sheet-in td:last-child{text-align:right;color:var(--muted)}
.sheet-in ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.close{justify-self:end;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 14px;cursor:pointer}
.prose{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.prose h2{font-size:1.1rem;margin-bottom:6px}
.prose ul{margin:0;padding-left:1.2em}
@keyframes swl{from{opacity:.4;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes swr{from{opacity:.4;transform:translateX(-28px)}to{opacity:1;transform:none}}
#today.swl{animation:swl .22s ease-out}#today.swr{animation:swr .22s ease-out}
@media (prefers-reduced-motion:reduce){#today.swl,#today.swr{animation:none}}
#today{touch-action:pan-y}
</style>
</head>
<body>
<div class="wrap">
<nav class="views" aria-label="ページの切り替え">
<a href="#today" data-v="today">今日</a>
<a href="#calendar" data-v="calendar">カレンダー</a>
<a href="#recipes" data-v="recipes">レシピ</a>
<a href="#rules" data-v="rules">決まり</a>

<section id="v-recipes" hidden><div class="rlist" id="rlist"></div></section>
<section id="v-rules" hidden><div class="wrap" id="rules"></div></section>

function showSheet(h){document.getElementById('sheet-body').innerHTML=h;sheet.hidden=false;document.getElementById('sheet-x').focus()}
document.getElementById('sheet-x').onclick=()=>{sheet.hidden=true};
sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')sheet.hidden=true});
/* カレンダー */
const MONTHS=[];DAYS.forEach(k=>{const m=k.slice(0,7);if(!MONTHS.includes(m))MONTHS.push(m)});
let mi=Math.max(0,MONTHS.indexOf(today.slice(0,7)));
function renderCal(){const mt=document.getElementById('mtabs');mt.innerHTML=MONTHS.map((m,i)=>'<button type="button" aria-pressed="'+(i===mi)+'" data-mi="'+i+'">'+(+m.slice(5))+'月</button>').join('');
  mt.querySelectorAll('[data-mi]').forEach(b=>b.onclick=()=>{mi=+b.dataset.mi;renderCal()});
  const [y,m]=MONTHS[mi].split('-').map(Number),g=document.getElementById('grid');let h=W.map(w=>'<div class="dow">'+w+'</div>').join('');
  const lead=(new Date(y,m-1,1).getDay()+6)%7;for(let i=0;i<lead;i++)h+='<div class="cell empty"></div>';
  const n=new Date(y,m,0).getDate();for(let d=1;d<=n;d++){const k=y+'-'+pad(m)+'-'+pad(d),on=DAYS.includes(k);
    h+='<button type="button" class="cell'+(on?'':' off')+(k===today?' today':'')+'"'+(on?' data-day="'+k+'"':' disabled')+'><span class="d">'+d+'</span>'+(on?'<span class="m">'+esc(mainOf(plan(k).D)[0])+'</span>':'')+'</button>'}
  g.innerHTML=h;g.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{sel=b.dataset.day;location.hash='#today'})}
/* レシピ一覧 */
function renderRecipes(){const used=[];DATA.home.forEach(t=>t.D.forEach(x=>{if(x[6]!=='rice'&&!used.includes(x[0]))used.push(x[0])}));
  const grp=[['夜の主菜',x=>{const it=DATA.home.flatMap(t=>t.D).find(i=>i[0]===x);return it&&(it[6]==='main'||it[6]==='one')}],['夜の副菜・汁物',x=>true]];
  let h='<section><h2>朝ごはん（毎日）</h2><ul><li><button type="button" class="rb" data-bl="B0">'+esc(DATA.B[0].n)+'</button></li></ul></section>';
  h+='<section><h2>昼ごはん</h2><ul><li class="small muted">基本は前の晩の主菜の残り</li><li><button type="button" class="rb" data-bl="L0">'+esc(DATA.L[0].n)+'</button> <span class="small muted">パスタの次の日</span></li></ul></section>';
  const mains=used.filter(grp[0][1]),sides=used.filter(x=>!mains.includes(x));
  h+='<section><h2>夜の主菜（長谷川あかり）</h2><ul>'+mains.map(n=>'<li><button type="button" class="rb" data-r="'+esc(n)+'">'+esc(n)+'</button></li>').join('')+'</ul></section>';
  h+='<section><h2>夜の副菜・汁物</h2><ul>'+sides.map(n=>'<li><button type="button" class="rb" data-r="'+esc(n)+'">'+esc(n)+'</button></li>').join('')+'</ul></section>';
  const el=document.getElementById('rlist');el.innerHTML=h;bindRecipes(el)}
function renderRules(){document.getElementById('rules').innerHTML=`
<div class="prose"><h2>この献立の考え方</h2><ul>
<li>夜は長谷川あかりさんのレシピで、3人同じものを食べる。辛いもの・生ものは入れていない。子どもの分を先に取り分ける料理には、注記がある</li>
<li>朝と昼はパパと子どもの分。朝は毎日同じ。夜は28日でくり返す</li>
<li>夜はレシピの2倍で作って、次の日の昼は残りを食べる。パスタの日だけは1.5倍で作って、次の日の昼は肉うどん</li></ul></div>
<div class="prose"><h2>パパの量（細マッチョ計画）</h2><ul>
<li>1日の目安は約2,100〜2,200kcal、たんぱく質120g。夜のごはんは200g</li>
<li>プロテインは筋トレの日（月〜土）は2杯（朝ごはんのあとと筋トレのあと）、日曜は1杯。1杯25gで約100kcal・たんぱく質約20gとして計算</li>
<li>「今日」の画面のいちばん下に、その日の合計が出る。目安に足りない日は、おやつ（ヨーグルトとバナナ、またはゆで卵）が自動で入る。多すぎる日は夜のごはんを150gにする</li></ul></div>
<div class="prose"><h2>子ども（1歳11か月ごろ）の量</h2><ul>
<li>だいたい大人の1/3。ごはんは1食80gくらい</li>
<li>卵はしっかり火を通す。魚の骨、手羽の骨に気をつける。こしょう・わさび・生のしょうがは取り分けてから</li>
<li>麺は短く切る。味が薄くて食べないときは、しょうゆを少したらすと食べやすい</li></ul></div>
<div class="prose"><h2>ママの量</h2><ul><li>夜ごはん1人前＋ごはん100g</li></ul></div>`}
/* 表示切り替え */
const VIEWS=['today','calendar','recipes','rules'];
function route(){const h=location.hash.slice(1),v=VIEWS.includes(h)?h:'today';VIEWS.forEach(x=>document.getElementById('v-'+x).hidden=x!==v);
  document.querySelectorAll('nav.views a').forEach(a=>a.setAttribute('aria-current',a.dataset.v===v?'page':'false'));
  ({today:renderToday,calendar:renderCal,recipes:renderRecipes,rules:renderRules})[v]();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
(function(){const el=document.getElementById('today');let x0=null,y0=0,t0=0;
  el.addEventListener('touchstart',e=>{if(e.touches.length!==1)return x0=null;x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now()},{passive:true});
  el.addEventListener('touchend',e=>{if(x0==null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)*0.6||Date.now()-t0>800)return;const i=DAYS.indexOf(sel),n=DAYS[i+(dx<0?1:-1)];if(!n)return;
    sel=n;renderToday();window.scrollTo(0,0);el.classList.remove('swl','swr');void el.offsetWidth;el.classList.add(dx<0?'swl':'swr')},{passive:true})})();
async function checkUpdate(){try{const s=await (await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'})).text();const m=s.match(/const BUILD='([0-9]+)'/);if(m&&m[1]!==BUILD)location.reload()}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
const QD=new URLSearchParams(location.search).get('d');if(QD&&DAYS.includes(QD))sel=QD;
route();
</script>
