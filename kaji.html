<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="うちの家事">
<meta name="theme-color" content="#faf6ef">
<title>うちの家事</title>
<link rel="apple-touch-icon" href="kaji-icon.png">
<link rel="icon" href="kaji-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#efe6d2; --cream:#fffbed; --paper:#fbf4e2; --navy:#1f526e; --sub:rgba(31,82,110,.62); --line:rgba(31,82,110,.10);
  --brown:#937c60; --amber:#e3a83b; --amber-hi:#f3c15a; --red:#d4665f;
  --h:#2fa39b; --h-soft:#d7efe9; --y:#ec8a6b; --y-soft:#fbe3d9; --any:#b5a68c; --any-soft:#efe7d6;
  --sh:0 6px 16px rgba(31,82,110,.10), 0 2px 4px rgba(31,82,110,.06);
  --sh-lift:0 10px 22px rgba(31,82,110,.14), 0 3px 6px rgba(31,82,110,.08);
  --ink:var(--navy); --card:var(--cream); --accent:var(--navy);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--navy);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-weight:500;font-size:15px}
body{background-color:var(--sand);background-image:radial-gradient(rgba(147,124,96,.13) 1.6px,transparent 1.8px);background-size:18px 18px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
b,strong,h1,h2,h3{font-weight:800}

/* ヘッダー：浮いた名札 */
header{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;background:linear-gradient(var(--sand) 70%,rgba(239,230,210,0))}
.hbar{display:flex;align-items:center;gap:10px;background:var(--cream);border-radius:999px;padding:7px 8px 7px 8px;box-shadow:var(--sh);max-width:640px;margin:0 auto}
header .logo{width:32px;height:32px;border-radius:10px;flex:none}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.02em}
header .date{font-size:12px;color:var(--sub);font-weight:700;margin-left:6px}
.me-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--paper);font-size:13px;font-weight:700}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.dot.h{background:var(--h)} .dot.y{background:var(--y)} .dot.any{background:var(--any)}
.sync{width:9px;height:9px;border-radius:50%;background:#d6cbb5}
.sync.ok{background:#7cc27a}.sync.pending{background:var(--amber)}.sync.err{background:var(--red)}

main{padding:6px 14px calc(110px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}

/* 下のメニュー：角丸の色タイル */
nav.tabs{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;background:var(--cream);border-radius:26px;box-shadow:var(--sh-lift);display:flex;padding:8px 6px;z-index:6}
nav.tabs button{flex:1;padding:2px 0;font-size:11px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
nav.tabs .tile{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;transition:transform .18s cubic-bezier(.3,1.6,.5,1);opacity:.55}
nav.tabs .tile svg{width:22px;height:22px;fill:none;stroke:#fffbed;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[data-t=today] .tile{background:var(--amber)}
nav.tabs button[data-t=week] .tile{background:var(--h)}
nav.tabs button[data-t=review] .tile{background:var(--y)}
nav.tabs button[data-t=settings] .tile{background:var(--brown)}
nav.tabs button.on{color:var(--navy)}
nav.tabs button.on .tile{opacity:1;transform:translateY(-3px) scale(1.06)}
.badge-n{position:absolute;top:-4px;left:calc(50% + 10px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--cream)}

/* 見出し：ちょっと傾いた札 */
h2{display:inline-block;font-size:13px;color:var(--cream);margin:22px 4px 10px;padding:4px 14px;border-radius:999px;background:var(--brown);transform:rotate(-2deg);letter-spacing:.06em;box-shadow:0 2px 0 rgba(31,82,110,.08)}
h2.s-morning{background:var(--amber)} h2.s-day{background:var(--h)} h2.s-night{background:#5b6fa8} h2.s-any{background:var(--brown)}
.panel{background:var(--cream);border-radius:26px;padding:16px;box-shadow:var(--sh)}
.muted{color:var(--sub);font-size:13px}

/* 話しかけてくる吹き出し */
.talk{position:relative;margin:14px 2px 6px;background:var(--cream);border-radius:34px 30px 36px 28px;padding:24px 20px 18px;box-shadow:var(--sh);min-height:86px}
.talk .tag{position:absolute;top:-12px;left:18px;background:var(--amber);color:var(--navy);font-weight:800;font-size:13px;padding:4px 14px;border-radius:999px;transform:rotate(-4deg);box-shadow:0 2px 6px rgba(31,82,110,.12)}
.talk .msg{font-size:16px;line-height:1.7;font-weight:700;min-height:1.7em}
.talk .next{position:absolute;right:20px;bottom:10px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--amber);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}

/* タイムライン */
.tl{position:relative;height:48px;margin:2px 4px 0}
.tl .bar{position:absolute;left:0;right:0;top:18px;height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,#e9dfc9 0 12px,#e2d6bc 12px 24px)}
.tl .now{position:absolute;top:8px;width:4px;height:28px;margin-left:-2px;background:var(--navy);border-radius:2px}
.tl .d{position:absolute;top:13px;width:18px;height:18px;margin-left:-9px;border-radius:50%;border:3px solid var(--cream);box-shadow:0 2px 4px rgba(31,82,110,.18)}
.tl .tick{position:absolute;top:34px;font-size:10px;font-weight:700;color:var(--sub);transform:translateX(-50%)}
.legend{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--sub);margin-top:4px}
.legend span{display:flex;align-items:center;gap:5px}

/* 家事カード */
.card{display:flex;align-items:center;gap:12px;background:var(--cream);border-radius:24px;padding:13px 12px 13px 16px;margin-bottom:10px;box-shadow:var(--sh);position:relative;transition:transform .15s}
.card:active{transform:scale(.985)}
.card .stripe{display:none}
.card .body{flex:1;min-width:0}
.card .name{font-weight:800;font-size:15.5px}
.card .meta{font-size:12px;color:var(--sub);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:700}
.card.done{background:var(--paper);box-shadow:0 2px 6px rgba(31,82,110,.05)}
.card.done .name{color:var(--sub)}
.check{width:44px;height:44px;border-radius:50%;border:3px dashed #d9ccb1;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex:none;background:var(--paper);transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.check:active{transform:scale(.85)}
.check.on{border-style:solid;border-color:transparent}
.check.on.h{background:var(--h)}.check.on.y{background:var(--y)}
.check.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.thanks{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#fff;color:var(--sub);box-shadow:0 1px 3px rgba(31,82,110,.12)}
.thanks.on{background:#ffe9ee;color:#d0546b}
.badge{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px}
.badge.h{background:var(--h-soft);color:#1f7d76}.badge.y{background:var(--y-soft);color:#c4603f}.badge.any{background:var(--any-soft);color:var(--brown)}
.empty{text-align:center;padding:24px 10px;color:var(--sub);font-size:13px;font-weight:700}

.fab{position:fixed;right:16px;bottom:calc(98px + env(safe-area-inset-bottom));background:linear-gradient(var(--amber-hi),var(--amber));color:var(--navy);border-radius:999px;padding:12px 18px;font-weight:800;box-shadow:var(--sh-lift),inset 0 0 0 2px rgba(255,255,255,.3);z-index:4}
.fab:active{transform:translateY(2px)}
.minirow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:2px dotted var(--line);font-size:14px;font-weight:700}
.minirow:last-child{border-bottom:0}
.minirow .t{color:var(--sub);font-size:12px;width:40px;flex:none}
.minirow .n{flex:1}

/* 週 */
.weeknav{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 12px}
.weeknav button{padding:7px 14px;border-radius:999px;background:var(--cream);box-shadow:var(--sh);font-weight:700}
.weeknav b{background:var(--cream);padding:6px 16px;border-radius:999px;box-shadow:var(--sh)}
.wgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wday{background:var(--cream);border-radius:18px;min-height:122px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;box-shadow:var(--sh)}
.wday.today{box-shadow:0 0 0 3px var(--amber),var(--sh)}
.wday.sel{background:var(--paper);transform:translateY(-2px)}
.wday .wd{font-size:11px;font-weight:700;color:var(--sub)}
.wday .dn{font-size:16px;font-weight:800;margin-bottom:6px}
.wday .dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.wday .dots i{width:9px;height:9px;border-radius:50%;display:block}
.wday .dots i.h{background:var(--h)}.wday .dots i.y{background:var(--y)}

/* 振り返り */
.reveal{width:100%;padding:16px;border-radius:24px;border:3px dashed #d9ccb1;color:var(--sub);background:var(--paper);font-weight:700}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who{border-radius:22px;padding:14px}
.who.h{background:var(--h-soft)}.who.y{background:var(--y-soft)}
.who .nm{font-weight:800;font-size:14px;margin-bottom:6px}
.who ul{margin:0;padding-left:16px;font-size:13px;line-height:1.75}
.note{padding:12px 2px;border-bottom:2px dotted var(--line)}
.note:last-child{border-bottom:0}
.note .txt{font-size:14px;font-weight:700;white-space:pre-wrap}
.note .m{font-size:12px;color:var(--sub);margin-top:6px;display:flex;gap:8px;align-items:center}

/* ボタン */
.btn{padding:11px 18px;border-radius:999px;background:linear-gradient(#3b7394,var(--navy));color:var(--cream);font-weight:800;box-shadow:0 3px 8px rgba(31,82,110,.2),inset 0 0 0 2px rgba(255,255,255,.18)}
.btn:active{transform:translateY(2px)}
.btn.go{background:linear-gradient(var(--amber-hi),var(--amber));color:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(31,82,110,.12)}
.btn.small{padding:6px 12px;font-size:12px}
.btn.danger{background:#fff;color:var(--red);box-shadow:inset 0 0 0 2px #f1cdc9}
.btn.wide{width:100%;padding:14px}
.row{display:flex;gap:8px;align-items:center}
.list-item{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:2px dotted var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .n{flex:1;min-width:0;font-weight:700}
.list-item .n small{display:block;color:var(--sub);font-size:12px}
.ord{display:flex;flex-direction:column}
.ord button{font-size:11px;color:var(--sub);padding:1px 6px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:16px 0 6px}
input.t,textarea.t,select.t{width:100%;padding:12px 14px;border-radius:18px;border:0;background:#fff;outline:none;box-shadow:inset 0 0 0 2px var(--line);font-weight:700}
input.t:focus,textarea.t:focus{box-shadow:inset 0 0 0 2px var(--amber)}
textarea.t{min-height:72px;resize:vertical}
.seg{display:flex;background:var(--paper);border-radius:999px;padding:4px;gap:3px;box-shadow:inset 0 0 0 2px var(--line)}
.seg button{flex:1;padding:8px 4px;border-radius:999px;font-size:13px;font-weight:700;color:var(--sub)}
.seg button.on{background:linear-gradient(var(--amber-hi),var(--amber));color:var(--navy);box-shadow:0 2px 5px rgba(31,82,110,.15)}
.days{display:flex;gap:5px;margin-top:8px}
.days button{flex:1;padding:9px 0;border-radius:14px;background:#fff;font-size:13px;font-weight:700;box-shadow:inset 0 0 0 2px var(--line)}
.days button.on{background:var(--navy);color:var(--cream);box-shadow:none}

/* シート：下からせり上がるメモ帳 */
.scrim{position:fixed;inset:0;background:rgba(31,82,110,.30);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:8px;right:8px;bottom:8px;z-index:21;background:var(--cream);border-radius:32px;max-height:86vh;overflow:auto;padding:14px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .32s cubic-bezier(.3,1.25,.5,1);max-width:620px;margin:0 auto;box-shadow:var(--sh-lift)}
.sheet.open{transform:none}
.sheet .grab{display:none}
.sheet .x{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:16px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);z-index:2}
.sheet h3{margin:4px 0 6px;font-size:20px}
.defs{list-style:none;padding:0;margin:8px 0 0}
.defs li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:2px dotted var(--line);font-size:14px;font-weight:700}
.defs li:last-child{border-bottom:0}
.defs li .bx{width:22px;height:22px;border-radius:8px;box-shadow:inset 0 0 0 2px #d9ccb1;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.defs li.on .bx{background:var(--h);box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chips button{padding:7px 13px;border-radius:999px;background:#fff;font-size:13px;font-weight:700;box-shadow:0 2px 5px rgba(31,82,110,.1)}
.chips button:active{transform:scale(.95)}

/* トースト：小さな吹き出し */
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px) scale(.9);background:var(--cream);color:var(--navy);padding:12px 20px;border-radius:24px;font-size:14px;font-weight:800;opacity:0;transition:all .25s cubic-bezier(.3,1.6,.5,1);z-index:30;pointer-events:none;white-space:nowrap;box-shadow:var(--sh-lift)}
.toast::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:var(--cream)}
.toast.show{opacity:1;transform:translateX(-50%)}

/* きらきら */
.spark{position:fixed;width:10px;height:10px;pointer-events:none;z-index:40;animation:spark .7s ease-out forwards}
.spark.star{background:var(--amber-hi);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.spark.leaf{background:#8fcf7e;border-radius:0 70% 0 70%}
.spark.heart{color:#e2657e;font-size:16px;width:auto;height:auto;font-weight:800}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.6) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(160deg)}}

.onboard{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.onboard .big{padding:22px;border-radius:999px;font-size:18px;font-weight:800;color:#fff;box-shadow:var(--sh-lift)}
.onboard .big.h{background:var(--h)}.onboard .big.y{background:var(--y)}
.hint{font-size:12px;color:var(--sub);line-height:1.7;margin-top:8px;font-weight:700}
.dot.both,.wday .dots i.both,.check.on.both{background:linear-gradient(90deg,var(--h) 50%,var(--y) 50%);border-color:transparent}
.join{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:2px dashed #d9ccb1;color:var(--sub);background:#fff}
.togglerow{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;font-weight:700}
.togglerow input{width:20px;height:20px;accent-color:var(--h)}
.gpanel{padding:12px 12px 10px}
.gtitle{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;margin:0 4px 8px}
.gtitle span{font-size:12px;color:var(--sub);background:var(--paper);padding:2px 10px;border-radius:999px}
.garden{width:100%;display:block}
.garden .fl{cursor:pointer}
.garden .bloom{transform-box:fill-box;transform-origin:center bottom}
.garden .bloom.sway{animation:sway .8s ease-in-out}
@keyframes sway{25%{transform:rotate(-12deg)}60%{transform:rotate(9deg)}100%{transform:rotate(0)}}
.bloomlist{display:flex;flex-wrap:wrap;gap:6px 12px;margin:10px 4px 2px;font-size:12px;font-weight:700;color:var(--sub)}
.bloomlist span{display:flex;align-items:center;gap:4px}
.bloomlist svg{width:20px;height:20px}
nav.tabs button[data-t=zukan] .tile{background:#8b7bb5}
nav.tabs .tile{width:38px;height:38px}
.zhead{text-align:center}
.ztitle{font-weight:800;font-size:16px}
.zcount{font-size:13px;font-weight:700;color:var(--sub);margin-top:4px}
.zcount b{font-size:28px;color:var(--navy)}
.zbar{height:12px;border-radius:999px;background:var(--paper);box-shadow:inset 0 0 0 2px var(--line);margin-top:8px;overflow:hidden}
.zbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#8fcf7e,var(--h))}
.zgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.zcell{background:var(--cream);border-radius:18px;padding:6px 4px 8px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:2px}
.zcell svg{width:46px;height:46px}
.zcell.un svg,.zbig.un svg{filter:brightness(0) opacity(.13)}
.zcell .zn{font-size:10.5px;font-weight:800;line-height:1.3;text-align:center;min-height:2.6em;display:flex;align-items:center}
.zcell.un .zn{color:var(--sub)}
.zno{font-size:10px;font-weight:800;color:var(--sub)}
.zbig{display:flex;justify-content:center;margin:4px 0 2px}
.zbig svg{width:130px;height:130px}
.zbig{gap:10px;align-items:flex-end}
.zbig .zplant{width:100px;height:120px}
.cr .mv,.cr .face,.cr .tap{transform-box:fill-box;transform-origin:center}
.cr .tap.go{animation:tapjump .5s ease-out}
@keyframes tapjump{40%{transform:translateY(-7px)}}
.m-flutter{animation:flutter 9s ease-in-out infinite}
@keyframes flutter{0%,100%{transform:translate(0,0)}15%{transform:translate(10px,-6px)}30%{transform:translate(18px,2px)}45%{transform:translate(8px,10px)}60%{transform:translate(-6px,4px)}75%{transform:translate(-14px,-6px)}90%{transform:translate(-6px,-10px)}}
.m-flutter .face{animation:bob3 .5s ease-in-out infinite alternate}
@keyframes bob3{to{transform:translateY(-1.2px)}}
.m-flutter .wing-l,.m-flutter .wing-r{animation:flap .26s ease-in-out infinite alternate;transform-box:fill-box}
.wing-l{transform-origin:right center}.wing-r{transform-origin:left center}
@keyframes flap{to{transform:scaleX(.3)}}
.m-buzz{animation:buzz 6s ease-in-out infinite}
@keyframes buzz{0%,100%{transform:translate(0,0)}8%{transform:translate(1px,-1px)}16%{transform:translate(-1px,.6px)}24%{transform:translate(0,0)}32%{transform:translate(13px,-5px)}40%{transform:translate(14px,-4px)}48%{transform:translate(12px,-6px)}56%{transform:translate(13px,-5px)}66%{transform:translate(-7px,2px)}74%{transform:translate(-6px,1px)}82%{transform:translate(-8px,3px)}90%{transform:translate(-7px,2px)}}
.m-buzz .wing-l,.m-buzz .wing-r{animation:buzzw .07s linear infinite alternate;transform-box:fill-box}
@keyframes buzzw{to{transform:scaleX(.55)}}
.m-dart{animation:dart 8s ease-out infinite}
@keyframes dart{0%,28%{transform:translate(0,0)}33%,60%{transform:translate(26px,-10px)}65%,92%{transform:translate(-18px,-3px)}97%,100%{transform:translate(0,0)}}
.m-dart .wing-l,.m-dart .wing-r{animation:dartw .05s linear infinite alternate;transform-box:fill-box}
@keyframes dartw{to{transform:scaleY(.75)}}
.m-swoop{animation:swoop 7s linear infinite}
@keyframes swoop{0%{transform:translate(-230px,10px) rotate(-6deg)}25%{transform:translate(-115px,-8px) rotate(4deg)}50%{transform:translate(0,6px) rotate(-4deg)}75%{transform:translate(115px,-10px) rotate(5deg)}100%{transform:translate(230px,4px) rotate(-4deg)}}

@keyframes peck{0%,20%,26%,40%,46%,100%{transform:rotate(0)}22%,42%{transform:rotate(18deg)}}

@keyframes turnB{0%{transform:scaleX(1)}47%{transform:scaleX(-1)}97%{transform:scaleX(1)}}
.m-frog{animation:frog 9s ease-in-out infinite}
@keyframes frog{0%,58%{transform:translate(0,0)}63%{transform:translate(6px,-7px)}68%,88%{transform:translate(12px,0)}93%{transform:translate(6px,-7px)}98%,100%{transform:translate(0,0)}}
.m-frog .face{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.03,.97)}}

@keyframes cricket{0%,76%{transform:translate(0,0)}80%{transform:translate(3px,-3px)}84%,92%{transform:translate(6px,0)}96%{transform:translate(3px,-3px)}100%{transform:translate(0,0)}}
.m-ladybug{animation:lady 14s ease-in-out infinite}
@keyframes lady{0%{transform:translate(0,0)}40%,50%{transform:translate(4px,-4px)}90%,100%{transform:translate(0,0)}}
.m-ladybug .face{animation:ladyrot 14s ease-in-out infinite}
@keyframes ladyrot{0%,40%{transform:rotate(45deg)}46%,90%{transform:rotate(225deg)}96%,100%{transform:rotate(405deg)}}
.m-still .face{animation:still 3s ease-in-out infinite}
@keyframes still{50%{transform:translateY(-.4px)}}
.m-sway .face{animation:msway 3.4s ease-in-out infinite alternate;transform-origin:center bottom}
@keyframes msway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.m-pend .face{animation:pend 4s ease-in-out infinite alternate;transform-origin:center top}
@keyframes pend{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.glow{animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.05}}
.bqprev{display:flex;justify-content:center;min-height:150px;align-items:center}

<body>
<header><div class="hbar">
  <img class="logo" src="kaji-icon.png" alt="">
  <h1>うちの家事<span class="date" id="hdate"></span></h1>
  <span class="sync" id="sync" title="同期"></span>
  <button class="me-chip" id="mechip"></button>
</div></header>
<main id="view"></main>
<button class="fab" id="fab">＋ 名もなき家事</button>
<nav class="tabs" id="tabs">
  <button data-t="today"><span class="tile"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></span>今日</button>
  <button data-t="week"><span class="tile"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="3.5"/><path d="M8 3.5v4M16 3.5v4M4 10.5h16"/><circle cx="9" cy="15" r=".6"/><circle cx="15" cy="15" r=".6"/></svg></span>週</button>
  <button data-t="review"><span class="tile"><svg viewBox="0 0 24 24"><path d="M5 6.5c0-1.4 1.1-2.5 2.5-2.5h9c1.4 0 2.5 1.1 2.5 2.5v7c0 1.4-1.1 2.5-2.5 2.5H11l-4 3.5V16h0c-1.1 0-2-.9-2-2z"/><path d="M9 9h6M9 12h4"/></svg></span>振り返り</button>
  <button data-t="zukan"><span class="tile"><svg viewBox="0 0 24 24"><path d="M5 5.5C5 4.7 5.7 4 6.5 4H18v14H6.5C5.7 18 5 18.7 5 19.5z"/><path d="M5 19.5C5 20.3 5.7 21 6.5 21H18v-3"/><circle cx="11.5" cy="10" r="2.2"/><path d="M11.5 12.2v3"/></svg></span>図鑑</button>
  <button data-t="settings"><span class="tile"><svg viewBox="0 0 24 24"><path d="M14.5 5.5a3.5 3.5 0 0 0-4.6 4.4L4.5 15.3a1.8 1.8 0 0 0 2.5 2.6l5.4-5.4a3.5 3.5 0 0 0 4.5-4.6l-2.1 2.1-2-.5-.5-2z"/></svg></span>設定</button>
</nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ========== 状態 ========== */
const LS = 'uchikaji.v1';
const SLOTS = [['morning','朝'],['day','昼'],['night','夜'],['any','いつでも']];
const WD = ['日','月','火','水','木','金','土'];
let S = (() => { try { return JSON.parse(localStorage.getItem(LS)) } catch(e) { return null } })()
  || { items:{}, me:null, url:'', key:'', lastSync:0, queue:[], seeded:false };
let tab = 'today', weekOff = 0, selDay = null, reviewOpen = false, syncState = 'local';

const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)) } catch(e) {} };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all = kind => Object.values(S.items).filter(i => i.kind === kind && !i.deleted);
const $ = id => document.getElementById(id);

function put(item){
  item.updatedAt = Date.now();
  S.items[item.id] = item;
  S.queue = S.queue.filter(q => q.id !== item.id);
  S.queue.push(item);
  save(); render(); push();
}
const remove = item => put({ ...item, deleted:true });

function settings(){
  return S.items.settings || { id:'settings', kind:'settings', names:{ h:'拓輝', y:'佑理' } };
}
const nm = k => k === 'any' ? 'どちらでも' : (settings().names[k] || k);
const other = k => k === 'h' ? 'y' : 'h';

/* ========== 日付 ========== */
const pad = n => String(n).padStart(2,'0');
const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` };
const hm = ts => { const d = new Date(ts); return `${d.getHours()}:${pad(d.getMinutes())}` };
const startOfDay = ts => { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime() };
const daysBetween = (a,b) => Math.round((startOfDay(b) - startOfDay(a)) / 864e5);
function weekStart(off){ const d = new Date(); d.setHours(0,0,0,0); const dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow+off*7); return d; }

/* ========== 家事ロジック ========== */
function choresSorted(){ return all('chore').sort((a,b) => (a.order??0) - (b.order??0)); }
function logsOn(key){ return all('log').filter(l => dayKey(l.at) === key).sort((a,b) => a.at - b.at); }
function lastDone(cid){ let m = 0; for (const l of all('log')) if (l.choreId === cid && l.at > m) m = l.at; return m; }
function isDueToday(c){
  const now = Date.now(), f = c.freq || { type:'daily' };
  if (f.type === 'daily') return true;
  if (f.type === 'weekly') return (f.days||[]).includes(new Date().getDay());
  if (f.type === 'interval'){
    const ld = lastDone(c.id);
    if (!ld) return true;
    if (dayKey(ld) === dayKey(now)) return true;
    return daysBetween(ld, now) >= (f.n || 1);
  }
  return true;
}
function freqText(c){
  const f = c.freq || { type:'daily' };
  if (f.type === 'daily') return '毎日';
  if (f.type === 'weekly') return (f.days||[]).slice().sort().map(d => WD[d]).join('・') + '曜';
  if (f.type === 'interval') return `${f.n||1}日ごと`;
  return '';
}

let popId = null, talkIdx = 0, lastTyped = '', typeT = null, html0 = '';
function talkMsg(due, logs){
  const me = S.me, h = new Date().getHours();
  const greet = h < 5 ? '夜ふかしだね。' : h < 10 ? 'おはよう！' : h < 17 ? 'こんにちは！' : 'おつかれさま！';
  const doneIds = new Set(logs.map(l => l.choreId));
  const left = due.filter(c => !doneIds.has(c.id));
  const mine = left.filter(c => c.owner === me).length;
  const fromOther = logs.filter(l => l.by !== me && !l.thanks);
  const openNotes = all('note').filter(n => n.status !== 'done').length;
  const msgs = [];
  if (!due.length) msgs.push(`${greet} 家事を登録すると、ここで今日の様子をお知らせするね。`);
  else if (!left.length) msgs.push(`今日の家事はぜんぶ終わり！ おつかれさま。あとはゆっくりしよう。`);
  else msgs.push(`${greet} 今日の家事は、あと${left.length}つ。${nm(me)}の担当は${mine ? mine + 'つ' : 'もう終わり'}だよ。`);
  if (fromOther.length) msgs.push(`${nm(other(me))}が今日${fromOther.length}つやってくれたみたい。♡ありがとう、送ってみる？`);
  const wk = weekLogs(0);
  if (wk.length){ const top = bloomSummary(wk)[0]; msgs.push(`今週は庭に${wk.length}輪咲いたよ。いちばん多いのは${FL[top[0]].n}。`); }
  const crw = creaturesFor(weekLogs(0)); if (crw.length) msgs.push(`今週は庭に${crw.slice(0, 2).join('と')}${crw.length > 2 ? 'たち' : ''}が遊びに来てるよ。タップしてみて。`);
  const inb = all('bouquet').filter(b => b.to === me && !b.opened); if (inb.length) msgs.unshift(`${nm(other(me))}から花束が届いてるよ。上の花束をタップしてみて。`);
  if (openNotes) msgs.push(`改善ボックスに${openNotes}つ入ってるよ。週に1回、ふたりで見てみよう。`);
  msgs.push(['気になったことは、その場で言わずに改善ボックスへ入れておこう。','小さな家事も「名もなき家事」から残せるよ。','一緒にやった家事は「ふたりで」を押してね。','「完了の定義」はふたりで決めて、ときどき見直そう。'][new Date().getDate() % 4]);
  return msgs[talkIdx % msgs.length];
}
function typeTalk(){
  const el = document.querySelector('.talk .msg'); if (!el) return;
  const full = el.dataset.full;
  clearInterval(typeT);
  if (full === lastTyped) { el.textContent = full; return; }
  lastTyped = full; let i = 0; el.textContent = '';
  typeT = setInterval(() => { i += 1; el.textContent = full.slice(0, i); if (i >= full.length) clearInterval(typeT); }, 38);
}
let actx;
function chime(kind){
  if (S.sound === false) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === 'thanks' ? [988, 1319] : kind === 'undo' ? [587, 440] : [784, 1175];
    notes.forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = f;
      const t = actx.currentTime + i * 0.09; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.13, t + 0.012); g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.42); });
  } catch(e) {}
}
function burst(el, kind){
  if (!el) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  const n = kind === 'heart' ? 6 : 10;
  for (let i = 0; i < n; i++){
    const s = document.createElement('span'), a = Math.random() * Math.PI * 2, d = 28 + Math.random() * 30;
    s.className = 'spark ' + (kind === 'heart' ? 'heart' : (i % 2 ? 'star' : 'leaf'));
    if (kind === 'heart') s.textContent = '♥';
    s.style.left = cx + 'px'; s.style.top = cy + 'px';
    s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', (Math.sin(a) * d - (kind === 'heart' ? 34 : 0)) + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 760);
  }
}
const cls = l => l.both ? 'both' : l.by;
const bg = l => l.both ? 'linear-gradient(90deg,var(--h) 50%,var(--y) 50%)' : `var(--${l.by})`;
const whoText = l => l.both ? 'ふたりで' : nm(l.by);
const involves = (l,k) => l.by === k || !!l.both;
function doChore(c, both){
  if (!S.me) return;
  const lg = { id:uid(), kind:'log', choreId:c.id, name:c.name, by:S.me, both:!!both, at:Date.now(), thanks:false };
  const isNew = !foundSet().has(flowerOf(lg));
  popId = lg.id; chime('do'); put(lg); setTimeout(() => { popId = null; }, 600);
  if (isNew) newFlower(lg); else toast(both ? `「${c.name}」ふたりでやった！` : `「${c.name}」やった！`);
}
let freeBoth = false;
function doFree(name){
  name = name.trim(); if (!name || !S.me) return;
  const lg = { id:uid(), kind:'log', choreId:null, name, by:S.me, both:freeBoth, at:Date.now(), thanks:false };
  const isNew = !foundSet().has(flowerOf(lg));
  put(lg); if (isNew) newFlower(lg); else toast(`「${name}」を記録しました`);
}
function foundSet(){ return new Set(all('log').map(flowerOf)); }
function newFlower(lg){
  const k = flowerOf(lg);
  setTimeout(() => { chime('thanks'); toast(`新しい花を見つけた！ ${FL[k].n}`); }, 350);
}
function toggleThanks(log){ if (!log.thanks) chime('thanks'); put({ ...log, thanks: !log.thanks }); if (!log.thanks) toast('ありがとうを送りました'); }

/* ========== 初期データ（仮） ========== */
function seedIfEmpty(){
  if (S.seeded || all('chore').length || Object.values(S.items).some(i => i.kind === 'chore')) { S.seeded = true; save(); return; }
  const C = (id,name,owner,slot,freq,def) => ({ id:'seed_'+id, kind:'chore', name, owner, slot, freq, def });
  const list = [
    C('breakfast','朝ごはんの準備','y','morning',{type:'daily'},['食卓に並べる','使った調理器具はシンクへ']),
    C('dish_am','朝の洗い物','h','morning',{type:'daily'},['シンクに何も残っていない','水切りカゴは空にしておく']),
    C('kid_am','子どもの支度','y','morning',{type:'daily'},['着替え・持ち物をそろえる','連絡帳を確認']),
    C('laundry','洗濯（回す・干す）','h','morning',{type:'daily'},['洗濯機を回して干すまで','洗濯機のフタは開けておく']),
    C('laundry_in','洗濯物の取り込み・たたむ','h','day',{type:'daily'},['たたんで各自の場所にしまう']),
    C('dinner','夕飯づくり','y','night',{type:'daily'},['食卓に並べる','コンロ周りをさっと拭く']),
    C('dish_pm','夜の洗い物','h','night',{type:'daily'},['シンクに何も残っていない','排水口のゴミを捨てる','台を拭く']),
    C('bath_clean','お風呂掃除','h','night',{type:'daily'},['浴槽を洗ってお湯はりまで','床の髪の毛を取る']),
    C('kid_bath','子どものお風呂','y','night',{type:'daily'},['体を洗って保湿まで']),
    C('trash','ゴミ出し','h','morning',{type:'weekly',days:[1,4]},['家中のゴミ箱を集める','新しい袋をセット']),
    C('vacuum','掃除機','any','any',{type:'interval',n:3},['リビングと寝室','コードを片付ける']),
    C('toilet','トイレ掃除','h','any',{type:'weekly',days:[6]},['便器の中と便座','床を拭く','ペーパーの補充']),
    C('shopping','買い出し','any','any',{type:'weekly',days:[0,3]},['リストのものを買う','冷蔵庫にしまう']),
    C('sheets','シーツ・枕カバー交換','any','any',{type:'interval',n:14},['外して洗濯','新しいものを付ける']),
  ];
  list.forEach((c,i) => { c.order = i; c.updatedAt = 1; S.items[c.id] = c; S.queue.push(c); });
  S.seeded = true; save();
}

/* ========== 同期（GAS） ========== */
let pushing = false;
async function push(){
  if (!S.url || pushing || !S.queue.length) { setSync(); return; }
  pushing = true; setSync('pending');
  const batch = S.queue.slice();
  try {
    const r = await fetch(S.url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ key:S.key, items:batch }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'error');
    const sent = new Map(batch.map(b => [b.id, b.updatedAt]));
    S.queue = S.queue.filter(q => sent.get(q.id) !== q.updatedAt);
    save(); syncState = 'ok';
  } catch(e) { syncState = 'err'; }
  pushing = false; setSync();
  if (S.queue.length && syncState === 'ok') push();
}
async function pull(){
  if (!S.url) { setSync(); return false; }
  try {
    const since = Math.max(0, (S.lastSync||0) - 60000);
    const r = await fetch(`${S.url}?key=${encodeURIComponent(S.key)}&since=${since}`);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'error');
    for (const it of j.items){
      const cur = S.items[it.id];
      if (!cur || (it.updatedAt||0) >= (cur.updatedAt||0)) S.items[it.id] = it;
    }
    S.lastSync = j.now; save(); syncState = 'ok'; setSync();
    return true;
  } catch(e) { syncState = 'err'; setSync(); return false; }
}
async function sync(){
  const ok = await pull();
  if (ok && !S.seeded) seedIfEmpty();
  await push();
  render();
}
function setSync(s){
  const el = $('sync');
  const st = s || (!S.url ? 'local' : S.queue.length ? (syncState==='err'?'err':'pending') : syncState);
  el.className = 'sync ' + (st==='ok'?'ok':st==='pending'?'pending':st==='err'?'err':'');
  el.title = { local:'この端末だけに保存中', ok:'同期済み', pending:'同期待ち', err:'同期エラー' }[st] || '';
}

/* ========== 季節の庭 ========== */
const FLOWER_DATA = `ウメ|2-3|round|#fdfbf3|#f4d86b|5
紅梅|2-3|round|#e5638a|#f4d06b|5
ロウバイ|1-2|round|#f3d35a|#9b6b1c|8
ソシンロウバイ|1-2|round|#f6dd6a|#f0cc3a|8

const FLD = {}; FLOWER_DESC.trim().split('\n').forEach(l => { const i = l.indexOf('|'); FLD[l.slice(0,i)] = l.slice(i+1); });
const VAR = { '白い':'白', '黄色い':'黄色', 'ピンクの':'ピンク', '紫の':'紫', '赤い':'赤', 'オレンジの':'オレンジ' };
function flDesc(n){ const m = n.match(/^(白い|黄色い|ピンクの|紫の|赤い|オレンジの)(.+)$/);
  if (m && FLD[m[2]]) return FLD[m[2]] + `この図鑑のものは、${VAR[m[1]]}の花が咲く品種。`; return FLD[n] || ''; }
const flMonths = n => FL[n].ms.split(',').map(r => r.includes('-') ? r.replace('-', '〜') + '月' : r + '月').join('・');
const hash = s => { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const rnd = (seed, i) => (hash(seed + ':' + i) % 10000) / 10000;
const flowerOf = l => { const list = SEASON[new Date(l.at).getMonth()+1]; return list[hash(l.id) % list.length]; };
const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k)));
  return '#' + [f(r), f(g), f(b)].map(v => v.toString(16).padStart(2, '0')).join(''); };

/* ---- 花びら・花芯の部品 ---- */
const PET = {
  round:  (L,w) => `M0 0 C ${w*1.25} ${-L*.18} ${w*1.15} ${-L*.92} 0 ${-L} C ${-w*1.15} ${-L*.92} ${-w*1.25} ${-L*.18} 0 0Z`,
  oval:   (L,w) => `M0 0 C ${w} ${-L*.1} ${w*1.05} ${-L*.8} ${w*.35} ${-L*.97} Q 0 ${-L*1.03} ${-w*.35} ${-L*.97} C ${-w*1.05} ${-L*.8} ${-w} ${-L*.1} 0 0Z`,
  pointed:(L,w) => `M0 0 C ${w*1.1} ${-L*.25} ${w*.8} ${-L*.7} 0 ${-L} C ${-w*.8} ${-L*.7} ${-w*1.1} ${-L*.25} 0 0Z`,
  notch:  (L,w) => `M0 0 C ${w*1.2} ${-L*.2} ${w*1.1} ${-L*.85} ${w*.45} ${-L} Q ${w*.12} ${-L*.98} 0 ${-L*.86} Q ${-w*.12} ${-L*.98} ${-w*.45} ${-L} C ${-w*1.1} ${-L*.85} ${-w*1.2} ${-L*.2} 0 0Z`,
  spoon:  (L,w) => `M0 0 C ${w*.5} ${-L*.3} ${w} ${-L*.65} ${w*.85} ${-L*.95} Q 0 ${-L*1.04} ${-w*.85} ${-L*.95} C ${-w} ${-L*.65} ${-w*.5} ${-L*.3} 0 0Z`,
  ray:    (L,w) => `M0 0 C ${w*.7} ${-L*.25} ${w} ${-L*.75} ${w*.7} ${-L*.97} L ${w*.25} ${-L*.92} L 0 ${-L} L ${-w*.25} ${-L*.92} L ${-w*.7} ${-L*.97} C ${-w} ${-L*.75} ${-w*.7} ${-L*.25} 0 0Z`,
  ruffle: (L,w) => { let d = `M0 0 C ${w*1.3} ${-L*.15} ${w*1.2} ${-L*.75} ${w} ${-L*.88}`; const n = 5; for (let i = 0; i < n; i++){ const x0 = w - (2*w)*(i/n), x1 = w - (2*w)*((i+1)/n), xm = (x0+x1)/2; d += ` Q ${xm} ${-L*(i%2?.93:1.06)} ${x1} ${-L*.9}`; } return d + ` C ${-w*1.2} ${-L*.75} ${-w*1.3} ${-L*.15} 0 0Z`; },
  strap:  (L,w) => `M0 0 C ${w*.9} ${-L*.3} ${w*.7} ${-L*.75} ${w*.15} ${-L} Q 0 ${-L*1.02} ${-w*.15} ${-L} C ${-w*.7} ${-L*.75} ${-w*.9} ${-L*.3} 0 0Z`,
  heart:  (L,w) => `M0 0 C ${w*1.4} ${-L*.1} ${w*1.4} ${-L*1.05} ${w*.4} ${-L} Q 0 ${-L*.97} 0 ${-L*.9} Q 0 ${-L*.97} ${-w*.4} ${-L} C ${-w*1.4} ${-L*1.05} ${-w*1.4} ${-L*.1} 0 0Z`,
};
let GID = 0;
function grad(c1, c2, c3){ const id = 'pg' + hash(c1 + c2 + c3).toString(36); return { id, def: `<linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${c1}"/><stop offset=".55" stop-color="${c2}"/><stop offset="1" stop-color="${c3}"/></linearGradient>` }; }
function rgrad(c1, c2){ const id = 'rg' + hash(c1 + c2).toString(36); return { id, def: `<radialGradient id="${id}" cx=".42" cy=".38" r=".7"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></radialGradient>` }; }

/* 花びらの輪：n枚、形、長さ、幅、色、ゆらぎ */
function petals(o, seed){
  const { n, shape='round', L=10, W=6, c, base, tip, off=0, vein=true, jit=1, sc=1, cup=0 } = o;
  const g = grad(base || shade(c, -.18), c, tip || shade(c, .22));
  let s = `<defs>${g.def}</defs>`;
  for (let i = 0; i < n; i++){
    const r = i * 360 / n + off + (rnd(seed, i) - .5) * 8 * jit, k = (1 + (rnd(seed, i + 50) - .5) * .14 * jit) * sc;
    const Lk = L * k, wk = W / 2 * k;
    s += `<g transform="rotate(${r.toFixed(1)})${cup ? ` scale(1 ${(1 - cup).toFixed(2)})` : ''}"><path d="${PET[shape](Lk, wk)}" fill="url(#${g.id})" stroke="${shade(c, -.32)}" stroke-opacity=".45" stroke-width=".35"/>`;
    if (vein) s += `<path d="M0 ${-Lk*.08} L0 ${-Lk*.72}" stroke="${shade(c, -.3)}" stroke-opacity=".3" stroke-width=".35"/><path d="M0 ${-Lk*.15} Q ${wk*.45} ${-Lk*.4} ${wk*.5} ${-Lk*.65} M0 ${-Lk*.15} Q ${-wk*.45} ${-Lk*.4} ${-wk*.5} ${-Lk*.65}" fill="none" stroke="${shade(c, -.3)}" stroke-opacity=".18" stroke-width=".3"/>`;
    s += `</g>`;
  }
  return s;
}
/* 花芯 */
function center(o, seed){
  const { type='dot', c='#f2c94a', r=2.6, n=14, len=4, anth } = o;
  const a = anth || shade(c, -.1);
  if (type === 'stamens'){
    let s = '';
    for (let i = 0; i < n; i++){ const ang = i * 360 / n + rnd(seed, i + 90) * 20, l = len * (.75 + rnd(seed, i + 70) * .45);
      s += `<g transform="rotate(${ang.toFixed(0)})"><line x1="0" y1="0" x2="0" y2="${-l}" stroke="${shade(a, .2)}" stroke-width=".35"/><ellipse cx="0" cy="${-l}" rx=".55" ry=".75" fill="${a}"/></g>`; }
    return s + `<circle r="${r*.5}" fill="${shade(c, -.1)}"/>`;
  }
  if (type === 'disc'){
    const g = rgrad(shade(c, .15), shade(c, -.35));
    let s = `<defs>${g.def}</defs><circle r="${r}" fill="url(#${g.id})"/>`;
    for (let i = 0; i < 34; i++){ const ang = i * 137.5 * Math.PI / 180, d = Math.sqrt(i / 34) * r * .88;
      s += `<circle cx="${(Math.cos(ang)*d).toFixed(2)}" cy="${(Math.sin(ang)*d).toFixed(2)}" r="${(r*.07).toFixed(2)}" fill="${shade(c, i % 3 ? -.45 : .25)}" opacity=".8"/>`; }
    return s;
  }
  if (type === 'tube') return `<circle r="${r}" fill="${shade(c, .1)}"/><circle r="${r*.7}" fill="${c}"/>` + center({ type:'stamens', c, n:12, len:r*1.1, anth:shade(c,-.15) }, seed);
  if (type === 'eye') return `<circle r="${r}" fill="${c}"/><circle r="${r*.45}" fill="${anth || '#fff'}"/>`;
  if (type === 'none') return '';
  return `<circle r="${r}" fill="${c}"/><circle r="${r*.45}" cx="${-r*.25}" cy="${-r*.25}" fill="#fff" opacity=".25"/>`;
}

/* ===== 汎用の部品（小花・穂・傘形） ===== */
const FLORET = {
  // 蝶形花（マメ科）：旗弁・翼弁・竜骨弁を横から
  pea(c, c2, k = 1){ return `<g transform="scale(${k})"><path d="M0 1 C -3.6 0 -4 -4.4 -1.4 -5.6 C .6 -6.2 2 -4.6 1.6 -2.6 C 1.4 -1 .8 0 0 1Z" fill="${c}" stroke="${shade(c,-.35)}" stroke-opacity=".4" stroke-width=".25"/><path d="M-.6 -1 Q -1.6 -3 -1 -4.6" stroke="${shade(c,-.25)}" stroke-width=".25" fill="none" opacity=".6"/><path d="M0 .6 C 2.6 .2 3.8 1.6 3 2.8 C 2 3.4 .6 2.6 0 .6Z" fill="${c2}" stroke="${shade(c2,-.3)}" stroke-opacity=".4" stroke-width=".25"/><path d="M.4 1.4 C 1.8 2.2 2.6 3.6 1.6 4 C .6 3.8 .2 2.6 .4 1.4Z" fill="${shade(c2, .12)}"/></g>`; },
  // 唇形花：上唇と下唇
  lip(c, c2, k = 1){ return `<g transform="scale(${k})"><path d="M-.8 2 L -1 -1 Q -1.4 -3.6 0 -4.2 Q 1.6 -4 1.4 -1 L 1 2Z" fill="${shade(c, -.05)}"/><path d="M-1 -1.2 C -3.6 -1 -3.6 -4.6 -1.2 -4.2 Q 0 -5.6 1.2 -4.2 C 3.6 -4.6 3.6 -1 1 -1.2Z" fill="${c}" stroke="${shade(c,-.3)}" stroke-opacity=".4" stroke-width=".25"/><path d="M-1.2 -1 C -3.4 .4 -2.4 2.6 0 2.2 C 2.4 2.6 3.4 .4 1.2 -1Z" fill="${shade(c, .1)}" stroke="${shade(c,-.3)}" stroke-opacity=".4" stroke-width=".25"/>${c2 ? `<ellipse cx="0" cy="-.4" rx=".9" ry=".7" fill="${c2}"/>` : ''}</g>`; },
  // 筒状の花（横向き）
  tube(c, c2, k = 1){ return `<g transform="scale(${k})"><path d="M-.8 2 C -1 -1 -1.4 -3 -2.4 -4.4 L 2.4 -4.4 C 1.4 -3 1 -1 .8 2Z" fill="${c}" stroke="${shade(c,-.3)}" stroke-opacity=".4" stroke-width=".25"/><ellipse cy="-4.4" rx="2.6" ry=".9" fill="${c2 || shade(c, .15)}"/></g>`; },
  // 星形6弁
  star6(c, c2, k = 1){ return `<g transform="scale(${k})">${Array.from({length:6}, (_, i) => `<path d="${PET.pointed(3.4, 1.6)}" fill="${i%2 ? c : shade(c, -.05)}" stroke="${shade(c,-.3)}" stroke-opacity=".35" stroke-width=".2" transform="rotate(${i*60})"/>`).join('')}<circle r=".6" fill="${c2 || shade(c, -.25)}"/></g>`; },
  // 5弁の小花
  five(c, c2, k = 1){ return `<g transform="scale(${k})">${Array.from({length:5}, (_, i) => `<path d="${PET.round(3.2, 2.4)}" fill="${c}" stroke="${shade(c,-.3)}" stroke-opacity=".35" stroke-width=".2" transform="rotate(${i*72})"/>`).join('')}<circle r=".7" fill="${c2 || '#f2d24a'}"/></g>`; },
  four(c, c2, k = 1){ return `<g transform="scale(${k})">${Array.from({length:4}, (_, i) => `<path d="${PET.round(3, 2.4)}" fill="${c}" stroke="${shade(c,-.3)}" stroke-opacity=".35" stroke-width=".2" transform="rotate(${i*90 + 45})"/>`).join('')}<circle r=".6" fill="${c2 || shade(c, -.25)}"/></g>`; },
  // 壺形（ムスカリ・ブルーベリー）
  urn(c, c2, k = 1){ return `<g transform="scale(${k})"><path d="M-1.6 -1.6 C -2.2 .6 -1.4 2.2 0 2.3 C 1.4 2.2 2.2 .6 1.6 -1.6 C 1 -2.4 -1 -2.4 -1.6 -1.6Z" fill="${c}" stroke="${shade(c,-.3)}" stroke-opacity=".4" stroke-width=".25"/><path d="M-.7 2.2 L0 2.9 L.7 2.2" stroke="${c2 || '#fff'}" stroke-width=".4" fill="none"/><path d="M-.9 -1 Q -1.2 .4 -.6 1.4" stroke="#fff" stroke-width=".35" opacity=".35" fill="none"/></g>`; },
  // 釣鐘（下向き）
  bellf(c, c2, k = 1){ return `<g transform="scale(${k})"><path d="M-2 2.6 C -2.4 -.6 -1.6 -2.6 0 -2.7 C 1.6 -2.6 2.4 -.6 2 2.6 L 2.8 3.4 Q 1.4 3 0 3.4 Q -1.4 3 -2.8 3.4Z" fill="${c}" stroke="${shade(c,-.3)}" stroke-opacity=".4" stroke-width=".25"/>${c2 ? `<circle cy="3.2" r=".4" fill="${c2}"/>` : ''}</g>`; },
  // 粒
  dot(c, c2, k = 1){ return `<circle r="${1.1*k}" fill="${c}"/><circle r="${.45*k}" cx="${-.3*k}" cy="${-.3*k}" fill="#fff" opacity=".35"/>`; },
};
Object.assign(DRAW, {
  // 穂：dir=up（上向きに咲き上がる）/ hang（垂れる）/ side（片側）
  raceme(f, s){ const p = f.sp, n = p.cnt || 12, fl = FLORET[p.fl || 'five'], c = f.c, c2 = f.c2, hang = p.dir === 'hang', len = p.len || 24;
    let o = `<path d="M0 ${hang ? -len/2 : len/2} Q ${p.curve || 0} 0 0 ${hang ? len/2 : -len/2}" stroke="${p.stem || '#6a9a4a'}" stroke-width=".7" fill="none"/>`;
    for (let i = 0; i < n; i++){ const t = i / (n - 1), y = hang ? -len/2 + t * len : len/2 - t * len, side = p.dir === 'side' ? 1 : (i % 2 ? 1 : -1), w = (p.w || 2.4) * (1 - t * (p.taper ?? .55)), k = (p.k || 1) * (1 - t * (p.shrink ?? .4));
      const bud = t > (p.budAt ?? .82), rot = (p.dir === 'side' ? 70 : side * (p.ang ?? 50)) + (hang ? 180 : 0);
      o += `<path d="M0 ${y.toFixed(1)} L ${(side * w).toFixed(1)} ${(y - (hang ? -1 : 1)).toFixed(1)}" stroke="${p.stem || '#6a9a4a'}" stroke-width=".25"/>`;
      o += `<g transform="translate(${(side * w).toFixed(1)},${(y - (hang ? -1 : 1)).toFixed(1)}) rotate(${(p.fl === 'pea' || p.fl === 'lip' || p.fl === 'tube' ? rot : (rnd(s, i) * 60)).toFixed(0)})">${bud ? `<ellipse rx="${(.9*k).toFixed(2)}" ry="${(1.3*k).toFixed(2)}" fill="${p.budC || shade(c, -.15)}"/>` : fl(i % 3 ? c : (c2 && p.mix ? c2 : shade(c, .08)), c2, k)}</g>`; }
    return o; },
  // 傘形：花茎の先から放射状に小花
  umbel(f, s){ const p = f.sp, n = p.cnt || 14, fl = FLORET[p.fl || 'star6'], r = p.r || 8;
    let o = '';
    for (let i = 0; i < n; i++){ const a = i * 137.5 * Math.PI / 180, d = Math.sqrt((i + .5) / n) * r, x = Math.cos(a) * d, y = Math.sin(a) * d * (p.flat ?? .85);
      if (p.stalks) o += `<line x1="0" y1="${r * .8}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#8aaa6a" stroke-width=".25"/>`;
      o += `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(rnd(s, i) * 90).toFixed(0)})">${fl(i % 3 && f.c2 && p.mix ? f.c2 : f.c, p.eye || f.c2, p.k || 1)}</g>`; }
    return o; },
});
/* radial の拡張：がく(cal)、蜜標の線(guide)、目の輪(ring)、斑点(dots) */
const _radial = DRAW.radial;
DRAW.radial = function(f, s){ const p = f.sp; let pre = '', post = '';
  if (p.cal) pre = ring(p.n, (p.L || 10) * .5, () => `<ellipse rx="1.2" ry="2" fill="${p.cal}"/>`, 180 / p.n);
  let body = _radial(f, s);
  if (p.guide) post += Array.from({length:p.n}, (_, i) => `<g transform="rotate(${i*360/p.n})">${[-1, 0, 1].map(x => `<path d="M${x*.4} -1.6 Q ${x*1.2} ${-(p.L||10)*.4} ${x*1.6} ${-(p.L||10)*.6}" stroke="${p.guide}" stroke-width=".35" fill="none" opacity=".75"/>`).join('')}</g>`).join('');
  if (p.ring) post = `<circle r="${(p.L||10)*.35}" fill="${p.ring}" opacity=".85"/>` + post;
  if (p.dots) for (let i = 0; i < 10; i++) post += `<circle cx="${((rnd(s, i)-.5)*4).toFixed(1)}" cy="${(-3 - rnd(s, i+9)*4).toFixed(1)}" r=".35" fill="${p.dots}"/>`;
  if (p.ring || p.guide || p.dots){ const ci = body.lastIndexOf('<circle'); /* 花芯を最後に重ね直す */ return pre + body + post + center({ type:p.ctr || 'dot', c:f.c2, r:p.cr || 2.2, n:p.sn || 12, len:p.sl || 3, anth:p.anth }, s + 'z'); }
  return pre + body;
};

    o += `<circle r="5.6" fill="${shade(cup, -.15)}"/><path d="${Array.from({length:14}, (_, i) => { const a = i * 360 / 14 * Math.PI / 180; const r = i % 2 ? 6.2 : 5.4; return `${i ? 'L' : 'M'} ${(Math.cos(a)*r).toFixed(2)} ${(Math.sin(a)*r).toFixed(2)}`; }).join(' ')}Z" fill="${cup}" stroke="${shade(cup, -.25)}" stroke-width=".35"/>`;

    return o + Array.from({length:10}, (_, i) => `<path d="M0 0 Q ${(Math.cos(i)*2).toFixed(1)} ${(Math.sin(i)*2 - 1).toFixed(1)} ${(Math.cos(i)*2.6).toFixed(1)} ${(Math.sin(i)*2.6 - 2).toFixed(1)}" stroke="${shade(f.c2, -.2)}" stroke-width=".35" fill="none"/>`).join(''); },

    for (let i = 0; i < 40; i++){ const a = i * 2.4, d = Math.sqrt(i / 40) * 4.2; o += `<path d="M${(Math.cos(a)*d).toFixed(1)} ${(Math.sin(a)*d).toFixed(1)} l .5 -.9 l .5 .9Z" fill="${i % 2 ? '#e8823a' : shade(f.c2, -.2)}"/>`; }
    return o; },
  nejibana(f, s){ const c = f.c; let o = `<path d="M0 14 L0 -13" stroke="#6a9a4a" stroke-width=".7"/>`;
    for (let i = 0; i < 18; i++){ const t = i / 18, a = i * 40 * Math.PI / 180, x = Math.sin(a) * 2.2, y = 12 - t * 25, front = Math.cos(a) > 0;
      if (!front) continue; o += `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(Math.sin(a) * 60).toFixed(0)}) scale(${(1 - t * .4).toFixed(2)})">${FLORET.lip(c, '#fff', .55)}</g>`; }
    return o; },
  hangesho(f, s){ return `<path d="M-2 14 L-2 -4" stroke="#6a9a4a" stroke-width=".8"/>${leaf('heart', 9, 5, '#f6f6ee', -2, -2, -40, 0)}${leaf('heart', 8, 4.6, '#6a9a4a', -2, 4, 40, 0)}<path d="M-2 -4 Q 4 -4 6 4 Q 7 8 5 12" stroke="#e8eee0" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-dasharray=".6 .3"/>`; },
  hozuki(f, s){ const c = f.c, g = rgrad(shade(c, .25), shade(c, -.15)); return `<defs>${g.def}</defs><path d="M0 -14 Q 2 -12 1 -9" stroke="#6a8a4a" stroke-width=".8" fill="none"/><path d="M1 -9 C 9 -8 9 6 1 10 C -7 6 -7 -8 1 -9Z" fill="url(#${g.id})" stroke="${shade(c, -.3)}" stroke-width=".4"/>${[-4, -1.6, 1.6, 4].map(x => `<path d="M1 -9 Q ${1 + x * 1.3} 0 1 10" stroke="${shade(c, -.25)}" stroke-width=".4" fill="none"/>`).join('')}`; },
  calyx_bell(f, s){ return DRAW.bell(f, s); },
  spathe(f, s){ const c = f.c, g = grad('#e8eedc', c, shade(c, .05)); return `<defs>${g.def}</defs><path d="M0 8 C -7 4 -8 -6 -1 -14 C 0 -12 1 -11 2 -10 C 7 -4 6 4 0 8Z" fill="url(#${g.id})" stroke="#c8ccb8" stroke-width=".4"/><path d="M-.4 6 C -2 2 -2 -6 -1 -12" stroke="#d8dccc" stroke-width=".4" fill="none"/><path d="M1 4 Q 1.6 -1 1.2 -5" stroke="${f.c2}" stroke-width="2.4" stroke-linecap="round"/>`; },
  komakusa(f, s){ const c = f.c; return [-1, 1].map(sd => `<g transform="scale(${sd},1)"><path d="M0 -6 C 5 -6 7 -1 5.4 4 C 4.4 7 2 7.6 .6 5" fill="${c}" stroke="${shade(c, -.3)}" stroke-opacity=".45" stroke-width=".35"/><path d="M5.4 4 Q 6.4 6 5 7.4" stroke="${c}" stroke-width="1.6" fill="none" stroke-linecap="round"/></g>`).join('') + `<path d="M-1.6 -5.6 C -2.2 0 -1.4 6 0 7.6 C 1.4 6 2.2 0 1.6 -5.6Z" fill="${f.c2}" stroke="${shade(c, -.3)}" stroke-opacity=".3" stroke-width=".3"/><path d="M0 -6 L0 -12" stroke="#8aaa8a" stroke-width=".7"/>`; },

    for (let i = 0; i < 5; i++) for (let j = 0; j < 9; j++){ const a = i * 72 - 28 + j * 7; o += `<path d="M0 0 Q ${(Math.sin(a*Math.PI/180) * 10).toFixed(1)} ${(-Math.cos(a*Math.PI/180) * 10).toFixed(1)} ${(Math.sin((a + (rnd(s, i*9+j)-.5)*20)*Math.PI/180) * 14).toFixed(1)} ${(-Math.cos((a + (rnd(s, i*9+j)-.5)*20)*Math.PI/180) * 14).toFixed(1)}" stroke="#fbfbf6" stroke-width=".35" fill="none"/>`; }

/* 1株を描く：原点が根元、上がマイナス。U＝花の基準サイズ */
function plantSVG(key, seed, U = 14){
  const P = plantOf(key), R = i => rnd(seed, 300 + i), H = P.h * U * (.85 + R(0) * .3), fs = P.fs * U / 14;
  const stemC = '#6aa84f', lc = P.lc || '#5a8a42', n = P.n || 1;
  let back = '', mid = '', front = '';
  const fl = (x, y, k = 1, rot = 0) => `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${rot.toFixed(0)}) scale(${(fs*k).toFixed(2)},${(fs*k*(SIDEVIEW.has(specOf(key)[0]) || P.type === 'spike' ? 1 : .78 + R(9)*.22)).toFixed(2)})"><g class="bloom">${flowerSVG(key, seed + ':' + x.toFixed(0))}</g></g>`;
  const stem = (x0, y0, x1, y1, w = 1, c = stemC, bend = 0) => `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} Q ${((x0+x1)/2 + bend).toFixed(1)} ${((y0+y1)/2).toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
  const L = (U * .55) * (P.big ? 1.6 : 1);
  switch (P.type){
    case 'single': case 'spike': {
      for (let i = 0; i < n; i++){
        const x = (i - (n-1)/2) * U * .55 + (R(i+1)-.5) * 3, top = -H * (1 - i * .12) * (.9 + R(i+5)*.15), bend = (R(i+10)-.5) * 6 + (P.arch ? 6 : 0);
        back += stem(x * .3, 0, x, top + (P.type === 'spike' ? 10 * fs : 0), 1.1, stemC, bend);
        const nl = P.leaf === 'needle' ? 12 : 4;
        for (let j = 0; j < nl; j++){ const t = (j + 1) / (nl + 2), y = top * t * (P.type === 'spike' ? .85 : .7), side = (j % 2 ? 1 : -1);
          mid += P.leaf === 'needle' ? leaf('needle', U*.32, 1.1, lc, x * t, y, side * 50) : leaf(P.leaf, L * (1 - t*.35), L * .32, lc, x * t + bend * t * .5, y, side * (P.opp ? 70 : 55)); if (P.opp) mid += leaf(P.leaf, L * (1 - t*.35), L * .32, lc, x*t, y, -side * 70); }
        if (P.collar) mid += leaf('fern', U * .45, U * .5, lc, x, top + 4, -70) + leaf('fern', U * .45, U * .5, lc, x, top + 4, 70);
        front += P.nod ? fl(x + 3, top + 2, 1, 20) : fl(x, top, 1, P.arch ? 20 : 0);
      } break; }
    case 'rosette': {
      for (let j = 0; j < 7; j++){ const a = -80 + j * 27 + (R(j+20)-.5) * 10;
        back += P.leaf === 'round' || P.leaf === 'heart' ? leaf(P.leaf, L * .75, L * .55, j % 2 ? lc : shade(lc, .08), (j - 3) * 1.4, 0, a, L * .5) : leaf(P.leaf, L * 1.1, L * .32, j % 2 ? lc : shade(lc, .08), 0, 0, a); }
      if (P.marble) back += Array.from({length:4}, (_, j) => `<ellipse cx="${(j - 1.5) * L * .55}" cy="${-L * .75}" rx="${L*.2}" ry="${L*.12}" fill="#c9d8c0" opacity=".45"/>`).join('');
      for (let i = 0; i < n; i++){ const x = (i - (n-1)/2) * U * .6 + (R(i+30)-.5)*3, top = -H * (.8 + R(i+40)*.25);
        mid += stem(0, -2, x, top, P.marble ? .6 : 1, P.marble ? '#8a4a5a' : stemC, (R(i+50)-.5)*5 + (P.nod ? 4 : 0)); front += fl(x, top, 1, P.nod ? 35 : 0); }
      break; }
    case 'bush': {
      const st = Math.max(n, 3);
      for (let i = 0; i < st; i++){ const a = (i - (st-1)/2) * 16 + (R(i+60)-.5) * 8, len = H * (.75 + R(i+70)*.3), x = Math.sin(a * Math.PI/180) * len, y = -Math.cos(a * Math.PI/180) * len;
        back += stem(0, 0, x, y, 1, stemC, (R(i+80)-.5)*4);
        for (let j = 0; j < 3; j++){ const t = .25 + j * .22; mid += leaf(P.leaf, L * .85, L * .3, j % 2 ? lc : shade(lc, .06), x * t, y * t, a + (j % 2 ? 55 : -55)); }
        if (i < n) front += fl(x, y, .9 + R(i+90)*.2); else front += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${1.6*fs}" ry="${2.2*fs}" fill="#7aa05a"/>`; }
      break; }
    case 'mound': case 'trail': {
      const w = U * (P.type === 'trail' ? 1.5 : 1.05);
      for (let j = 0; j < 11; j++){ const a = -85 + j * 17, r = w * (.6 + R(j+100)*.4);
        back += leaf(P.leaf, L * .65, L * .45, j % 2 ? lc : shade(lc, .08), Math.sin(a*Math.PI/180) * r * .4, -Math.abs(Math.cos(a*Math.PI/180)) * H * .2, a, P.type === 'trail' ? 0 : 2); }
      if (P.type === 'trail') back += `<path d="M${-w} 2 Q ${-w*.5} ${-H*.2} 0 ${-H*.3} Q ${w*.5} ${-H*.2} ${w} 2" stroke="${stemC}" stroke-width=".8" fill="none"/>`;
      for (let i = 0; i < n; i++){ const x = (i - (n-1)/2) * (w * 1.6 / Math.max(n, 2)) + (R(i+110)-.5)*3, y = -H * (.35 + R(i+120) * .45) * (P.type === 'trail' ? .8 : 1);
        mid += stem(x * .6, -H * .15, x, y, .7); front += fl(x, y, .9 + R(i+130)*.2); }
      break; }
    case 'shrub': {
      const wood = P.wood || '#7a6a5a', br = 3;
      back += stem(0, 0, 0, -H * .45, 2.2, wood);
      for (let i = 0; i < br; i++){ const a = (i - 1) * 32 + (R(i+140)-.5)*10, len = H * (.55 + R(i+150)*.15), x0 = 0, y0 = -H * (.3 + i * .08), x = Math.sin(a*Math.PI/180) * len * .8, y = y0 - Math.cos(a*Math.PI/180) * len * .75;
        back += stem(x0, y0, x, y, 1.4, wood, (R(i+160)-.5)*5);
        const nl = P.leaf === 'palmate' ? 1 : 4;
        for (let j = 0; j < nl; j++){ const t = .35 + j * .18, lx = x0 + (x - x0) * t, ly = y0 + (y - y0) * t;
          mid += P.leaf === 'palmate' ? leaf('palmate', L * .9, L * .26, lc, lx, ly, a + (i - 1) * 30, L * .5) : leaf(P.leaf, L * .9, L * .36, j % 2 ? lc : shade(lc, .1), lx, ly, a + (j % 2 ? 60 : -60), 0);
          if (P.gloss && P.leaf !== 'palmate') mid += `<ellipse cx="${lx.toFixed(1)}" cy="${(ly - 2).toFixed(1)}" rx=".6" ry="1.4" fill="#fff" opacity=".25" transform="rotate(${a + (j % 2 ? 60 : -60)} ${lx.toFixed(1)} ${ly.toFixed(1)})"/>`; }
        if (P.thorn) for (let j = 0; j < 3; j++){ const t = .3 + j * .2; back += `<path d="M${(x0 + (x-x0)*t).toFixed(1)} ${(y0 + (y-y0)*t).toFixed(1)} l 1.4 -.4 l -1.2 -.6Z" fill="#8a5a4a"/>`; }
        if (i < n) front += P.hang ? fl(x, y + 10 * fs, 1) : fl(x, y, .95 + R(i+170)*.15); }
      break; }
    case 'weep': {
      const wood = P.wood || '#4a3a3a';
      back += stem(0, 0, 0, -H, 2.6, wood);
      for (let b = 0; b < 7; b++){ const a = -70 + b * 23, len = U * (1 + R(b+400) * .4), x0 = 0, y0 = -H + 2, cx = Math.sin(a*Math.PI/180) * len, cy = y0 - U * .4, ex = cx * 1.15, ey = y0 + H * (.55 + R(b+410)*.25);
        back += `<path d="M${x0} ${y0} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="${wood}" stroke-width=".7" fill="none"/>`;
        for (let j = 0; j < 4; j++){ const t = .45 + j * .17, x = (1-t)*(1-t)*x0 + 2*(1-t)*t*cx + t*t*ex, y = (1-t)*(1-t)*y0 + 2*(1-t)*t*cy + t*t*ey; front += fl(x, y, .8 + R(b*5+j)*.3, (R(b+j)-.5)*40); } }
      break; }
    case 'arch': {
      const wood = P.wood || '#8a6a4a';
      for (let b = 0; b < 6; b++){ const side = b % 2 ? 1 : -1, len = U * (1.4 + R(b+420) * .8), ex = side * len, ey = -H * (.25 + R(b+430)*.25), cx = side * len * .3, cy = -H * (1 + R(b+440)*.2);
        back += `<path d="M0 0 Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="${wood}" stroke-width=".8" fill="none"/>`;
        const per = Math.ceil(n / 6) + 1;
        for (let j = 0; j < per; j++){ const t = .3 + j * (.65 / per), x = 2*(1-t)*t*cx + t*t*ex, y = 2*(1-t)*t*cy + t*t*ey;
          if (P.leafy) mid += leaf('lance', U*.35, U*.12, '#6a9a4a', x, y, side * 60 + (R(b*9+j)-.5)*30);
          front += fl(x, y - 1, .7 + R(b*7+j)*.3, side * 20); } }
      break; }
    case 'tree': {
      const wood = '#6a5a4a';
      back += stem(0, 0, 0, -H * .5, 3, wood);
      for (let b = 0; b < 4; b++){ const a = -50 + b * 33, x = Math.sin(a*Math.PI/180) * H * .4, y = -H * .5 - Math.cos(a*Math.PI/180) * H * .3; back += stem(0, -H * .45, x, y, 1.6, wood); }
      for (let j = 0; j < 18; j++){ const a = R(j+450) * Math.PI * 2, d = Math.sqrt(R(j+460)) * H * .38, x = Math.cos(a) * d, y = -H * .72 + Math.sin(a) * d * .7;
        mid += leaf(P.leaf || 'oval', U * .5, U * .2, j % 2 ? lc : shade(lc, .1), x, y, R(j+470) * 360); }
      for (let i = 0; i < n; i++){ const a = R(i+480) * Math.PI * 2, d = Math.sqrt(R(i+490)) * H * .38, x = Math.cos(a) * d, y = -H * .72 + Math.sin(a) * d * .7; front += fl(x, y, .9 + R(i+500)*.2); }
      break; }
    case 'vine': {
      back += `<path d="M-1 0 L -1 ${-H}" stroke="#b89a6a" stroke-width="1.2"/>`;
      let d = 'M0 0'; for (let j = 1; j <= 8; j++){ const y = -H * j / 8, x = (j % 2 ? 3.4 : -3.4); d += ` Q ${x} ${(y + H / 16).toFixed(1)} 0 ${y.toFixed(1)}`; }
      back += `<path d="${d}" stroke="${stemC}" stroke-width=".8" fill="none"/>`;
      for (let j = 0; j < 7; j++){ const y = -H * (j + .7) / 8, side = j % 2 ? 1 : -1; mid += leaf(P.leaf === 'oval' ? 'oval' : 'heart', U * .45, U * .32, j % 2 ? lc : shade(lc, .08), side * 2.6, y, side * 70, 1.4); }
      for (let i = 0; i < n; i++){ const y = -H * (.35 + i * (.6 / Math.max(n - 1, 1))), side = i % 2 ? 1 : -1; front += fl(side * U * .4, y, .95, side * 15); }
      break; }
    case 'pergola': {
      const wood = P.wood || '#7a6a5a';
      back += `<path d="M${-U*1.6} 0 L ${-U*1.6} ${-H} M${U*1.6} 0 L ${U*1.6} ${-H}" stroke="#9a8a6a" stroke-width="1.6"/><path d="M${-U*1.9} ${-H} L ${U*1.9} ${-H}" stroke="#9a8a6a" stroke-width="2"/>`;
      back += `<path d="M${-U*1.6} 0 Q ${-U*1.2} ${-H*.6} ${-U*1.4} ${-H}" stroke="${wood}" stroke-width="1.2" fill="none"/>`;
      for (let j = 0; j < 9; j++){ const x = -U * 1.7 + j * U * .42; mid += leaf('compound', U * .5, U * .3, j % 2 ? '#6a9a4a' : '#7aaa5a', x, -H + 1, 180 + (R(j+510)-.5)*40); }
      for (let i = 0; i < n; i++){ const x = -U * 1.3 + i * (U * 2.6 / Math.max(n - 1, 1)); front += fl(x, -H + 4 + 10 * fs, .95 + R(i+520)*.15); }
      break; }
    case 'iris': {
      for (let j = 0; j < 6; j++){ const a = -28 + j * 11 + (R(j+530)-.5)*4, l = H * (.6 + R(j+540) * .25); back += `<path d="M0 0 C ${(Math.sin(a*Math.PI/180)*l*.4 - 1.4).toFixed(1)} ${(-l*.5).toFixed(1)} ${(Math.sin(a*Math.PI/180)*l).toFixed(1)} ${(-l*.85).toFixed(1)} ${(Math.sin(a*Math.PI/180)*l*1.05).toFixed(1)} ${(-l).toFixed(1)} C ${(Math.sin(a*Math.PI/180)*l + .4).toFixed(1)} ${(-l*.8).toFixed(1)} ${(Math.sin(a*Math.PI/180)*l*.4 + 1.6).toFixed(1)} ${(-l*.4).toFixed(1)} 1.4 0Z" fill="${j % 2 ? lc : shade(lc, .1)}" stroke="${shade(lc, -.3)}" stroke-width=".3"/>`; }
      for (let i = 0; i < n; i++){ const x = (R(i+550)-.5) * 4, top = -H; mid += stem(0, 0, x, top, 1, stemC); front += fl(x, top, 1); }
      break; }
    case 'twig': {
      const wood = P.wood || '#5a4a3a'; let pts = [];
      back += stem(0, 0, 0, -H * .35, 2.2, wood);
      for (let b = 0; b < 3; b++){ let x = 0, y = -H * (.3 + b * .05), a = (b - 1) * 34 + (R(b+250)-.5)*10;
        for (let j = 0; j < 4; j++){ const len = H * (.2 - j * .025), nx = x + Math.sin(a*Math.PI/180) * len, ny = y - Math.cos(a*Math.PI/180) * len;
          back += stem(x, y, nx, ny, 1.6 - j * .3, wood); pts.push([nx, ny]); if (j % 2) pts.push([(x+nx)/2, (y+ny)/2]);
          if (j === 1) back += stem(nx, ny, nx + Math.sin((a + 40)*Math.PI/180) * len * .7, ny - Math.cos((a + 40)*Math.PI/180) * len * .7, .7, wood);
          x = nx; y = ny; a += (j % 2 ? 22 : -22); } }
      if (P.leafy) pts.forEach((p, i) => { if (i % 3 === 1) mid += leaf('oval', U*.3, U*.12, '#7aaa5a', p[0], p[1], (R(i+600)-.5)*120); });
      pts.forEach((p, i) => { if (i % 2 === 0 && front.split('<g transform').length - 1 < P.n * 1.6) front += fl(p[0] + (R(i+260)-.5)*2, p[1], .85 + R(i+270)*.3, (R(i+280)-.5)*40); else back += `<ellipse cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" rx="1.1" ry="1.5" fill="${shade(FL[key].c, -.1)}"/>`; });
      break; }
    case 'succulent': {
      for (let j = 0; j < 9; j++){ const a = -80 + j * 20 + (R(j+290)-.5)*6, l = U * (.7 + R(j+300)*.25);
        back += `<g transform="rotate(${a.toFixed(0)})"><path d="M-2 0 Q -1.6 ${-l*.6} 0 ${-l} Q 1.6 ${-l*.6} 2 0Z" fill="${j % 2 ? lc : shade(lc, .1)}" stroke="${shade(lc, -.3)}" stroke-width=".3"/>${[.3, .5, .7].map(t => `<path d="M1.6 ${-l*t} l 1 -.6 M-1.6 ${-l*t + 1} l -1 -.6" stroke="#c8d8a0" stroke-width=".4"/>`).join('')}</g>`; }
      for (let i = 0; i < n; i++){ const x = (i - (n-1)/2) * U * .5, top = -H * (.9 + R(i+310)*.15); mid += stem(0, -2, x, top + 8 * fs, 1, '#7a8a5a'); front += fl(x, top, 1); }
      break; }
    case 'cane': {
      const wood = '#7a8a5a';
      back += stem(0, 0, 1, -H, 2, wood, 2);
      for (let j = 1; j < 6; j++) back += `<path d="M-1.4 ${(-H*j/6).toFixed(1)} h2.8" stroke="${shade(wood, -.3)}" stroke-width=".6"/>`;
      for (let j = 0; j < 4; j++){ const y = -H * (.25 + j * .17); mid += leaf('compound', L * 1.1, L * .5, lc, 0, y, j % 2 ? 60 : -60); }
      for (let i = 0; i < n; i++){ const a = (i - (n-1)/2) * 40, x = Math.sin(a*Math.PI/180) * U * .9, y = -H - Math.cos(a*Math.PI/180) * U * .5 + 4;
        back += stem(1, -H + 4, x, y, .7); front += fl(x, y, 1, a * .3); }
      break; }
    case 'bulb': {
      const nl = P.short ? 7 : 5;
      if (P.bare){ }
      else if (P.wide){ for (let j = 0; j < 3; j++) back += leaf('lance', H * .55, U * .32, j % 2 ? lc : shade(lc, .1), (j - 1) * 2, 0, (j - 1) * 28); }
      else

/* --- どの生き物が来るか（週ごとに決まる） --- */
const CREATURES_ON = false; // 生き物はいったんお休み
function creaturesFor(logs){
  if (!CREATURES_ON || !logs.length) return [];
  const mo = new Date(logs[0].at).getMonth() + 1, wk = 'w' + Math.floor(Math.min(...logs.map(l => l.at)) / (7 * 864e5)) + ':';
  const names = new Set(logs.map(flowerOf)), plants = logs.map(l => plantOf(flowerOf(l)).type);
  const hasTree = plants.some(t => ['shrub', 'tree', 'twig', 'weep', 'cane', 'pergola', 'arch'].includes(t)), hasWater = plants.includes('water');
  const ok = Object.values(CR).filter(c => c.months.includes(mo) && (() => { const [k, v] = c.cond.split(':');
    if (k === 'min') return logs.length >= Number(v); if (k === 'tree') return hasTree; if (k === 'water') return hasWater; if (k === 'flower') return v.split(',').some(f => names.has(f)); return false; })());
  const max = Math.min(5, 1 + Math.floor(logs.length / 5));
  return ok.sort((a, b) => hash(wk.split(':')[0] + a.n) - hash(wk.split(':')[0] + b.n)).sort((a, b) => (b.cond.startsWith('flower') ? 1 : 0) - (a.cond.startsWith('flower') ? 1 : 0)).slice(0, max).map(c => c.n);
}
let crPending = new Set();
function noteCreatures(list){
  const fresh = list.filter(n => !S.items['cr_' + n] && !crPending.has(n)); if (!fresh.length) return;
  fresh.forEach(n => crPending.add(n));
  setTimeout(() => { fresh.forEach(n => { if (!S.items['cr_' + n]) { S.items['cr_' + n] = { id:'cr_' + n, kind:'creature', name:n, at:Date.now(), by:S.me, updatedAt:Date.now() }; S.queue.push(S.items['cr_' + n]); } crPending.delete(n); });
    save(); push(); chime('thanks'); toast(`庭に${fresh[0]}が遊びに来たよ！`); }, 900);
}
function creatureLayer(list, items, W, H, ground, U){
  let o = '';
  const perches = items.filter(it => ['shrub', 'tree', 'twig', 'weep', 'cane', 'arch', 'pergola'].includes(plantOf(it.sp).type));
  list.forEach((n, i) => { const c = CR[n], R = j => rnd(n + 'pos', j); let x, y, cls = '', sc = .9;
    if (c.kind === 'flyer'){ x = 30 + R(1) * (W - 60); y = 18 + R(2) * (ground - 60); cls = 'cr-fly'; sc = n === 'ツバメ' ? 1.1 : .85; }
    else if (c.kind === 'ground'){ x = 20 + R(3) * (W - 40); y = H - 14 - R(4) * 10; cls = 'cr-ground'; sc = 1; }
    else if ((c.kind === 'bird' || c.kind === 'perch') && perches.length && (c.kind === 'perch' || R(5) > .35)){
      const p = perches[Math.floor(R(6) * perches.length)], ph = plantOf(p.sp).h * U * p.k * .75; x = p.x + (R(7) - .5) * 14 * p.k; y = p.gy - ph * (.55 + R(8) * .3); cls = 'cr-perch'; sc = c.kind === 'perch' ? .8 : 1.05; }
    else { x = 24 + R(9) * (W - 48); y = H - 16 - R(10) * 12; cls = 'cr-hop'; sc = 1.1; }
    sc *= U / 11;
    if (n === 'ツバメ') { x = W / 2; y = 26 + R(2) * 30; }
    const m = BFLY[n] ? 'flutter' : (n === 'ミツバチ' || n === 'マルハナバチ') ? 'buzz' : (n === 'シオカラトンボ' || n === 'アキアカネ') ? 'dart' : n === 'ツバメ' ? 'swoop' : n === 'ゲンジボタル' ? 'wander'
      : BIRD2[n] ? (cls === 'cr-perch' ? 'perch' : 'hopwalk') : (n === 'カタツムリ' || n === 'ダンゴムシ') ? 'crawl' : n === 'アマガエル' ? 'frog' : n === 'スズムシ' ? 'cricket' : n === 'テントウムシ' ? 'ladybug'
      : n === 'カマキリ' ? 'sway' : n === 'ミノムシ' ? 'pend' : 'still';
    const flip = ['flutter', 'buzz', 'dart', 'wander', 'still', 'sway'].includes(m) && R(11) > .5 ? -1 : 1, dl = `animation-delay:-${(R(12) * 9).toFixed(1)}s`;
    let art = `<g transform="scale(${(sc * flip).toFixed(2)},${sc.toFixed(2)})">${creatureSVG(n)}</g>`;
    if (m === 'hopwalk') art = `<g class="peck" style="${dl}">${art}</g>`;
    o += `<g class="cr" data-act="creature" data-k="${esc(n)}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><g class="tap"><g class="mv m-${m}" style="${dl}"><g class="face" style="${dl}">${art}</g></g></g><rect x="-12" y="-12" width="24" height="24" fill="transparent"/></g>`; });
  return o;
}

    <path d="M0 ${ground-14} Q 60 ${ground-30} 130 ${ground-18} T 260 ${ground-20} T 360 ${ground-16} V ${ground+4} H 0Z" fill="#cfe3bf" opacity=".7"/>
    <path d="M0 ${ground-2} Q 90 ${ground-12} 180 ${ground-4} T 360 ${ground-6} V ${H} H 0Z" fill="url(#gsoil)"/>`;
  for (let i = 0; i < 34; i++){ const gx = (i*11 + 5) % W, gy = ground + 2 + (i*7 % (H - ground - 4)); svg += `<path d="M${gx} ${gy} l1.6 -4 l1.6 4" fill="none" stroke="#78ab5e" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>`; }
  for (const it of items){
    svg += `<g data-act="flower" data-id="${it.l.id}" class="fl" transform="translate(${it.x.toFixed(1)},${it.gy.toFixed(1)}) scale(${it.k.toFixed(2)})">

  }
  if (!items.length) svg += `<text x="${W/2}" y="${ground-34}" text-anchor="middle" font-size="12" font-weight="700" fill="rgba(31,82,110,.5)">家事をすると、ここに季節の花が咲くよ</text>`;
  const crs = creaturesFor(logs);
  svg += creatureLayer(crs, items, W, H, ground, big ? 23 : 19);
  if (crs.length && logs.every(l => l.at >= weekStart(0).getTime())) noteCreatures(crs);
  return svg + `</g></svg>`;
}
function weekLogs(off){ const ws = weekStart(off), we = new Date(ws); we.setDate(ws.getDate()+7); return all('log').filter(l => l.at >= ws.getTime() && l.at < we.getTime()); }
function bloomSummary(logs){
  const m = {}; logs.forEach(l => { const k = flowerOf(l); m[k] = (m[k]||0) + 1; });
  return Object.entries(m).sort((a,b) => b[1]-a[1]);
}

function render(){

  $('hdate').textContent = `${now.getMonth()+1}/${now.getDate()}（${WD[now.getDay()]}）`;

  $('mechip').innerHTML = me ? `<span class="dot ${me}"></span>${esc(nm(me))}` : '未設定';

  if (!me) { v.innerHTML = viewOnboard(); return; }

  const rb = document.querySelector('#tabs button[data-t=review]'); rb.querySelector('.badge-n')?.remove();

function timeline(logs, showNow){
  const now = new Date(), nowMin = now.getHours()*60 + now.getMinutes();
  const ticks = [0,6,12,18,24].map(h => `<span class="tick" style="left:${h/24*100}%">${h}</span>`).join('');
  const dots = logs.map(l => { const d = new Date(l.at); const m = d.getHours()*60 + d.getMinutes();
    return `<span class="d" style="left:${m/1440*100}%;background:${bg(l)}" title="${esc(hm(l.at)+' '+l.name)}"></span>` }).join('');
  return `<div class="tl"><div class="bar"></div>${ticks}${showNow?`<span class="now" style="left:${nowMin/1440*100}%"></span>`:''}${dots}</div>`;

function choreCard(c, todays){

  let meta = `<span class="badge ${c.owner}">${esc(nm(c.owner))}</span>`;
  if (done){
    meta = `<span>✓ ${hm(last.at)} ${esc(whoText(last))}</span>`;
    if (!last.both && last.by !== S.me) meta += `<button class="join" data-act="join" data-id="${last.id}">＋一緒にやった</button>`;
    if (last.by !== S.me) meta += `<button class="thanks ${last.thanks?'on':''}" data-act="thanks" data-id="${last.id}">${last.thanks?'♥ ありがとう済':'♡ ありがとう'}</button>`;

function viewToday(){
  const tk = dayKey(Date.now());
  const logs = logsOn(tk);
  const chores = choresSorted();
  const due = chores.filter(isDueToday);
  const dueIds = new Set(due.map(c => c.id));
  html0 = `<div class="talk" data-act="talk"><span class="tag">おうち</span><div class="msg" data-full="${esc(talkMsg(due, logs))}"></div><span class="next"></span></div>`;
  const wl = weekLogs(0);
  let html = bouquetBanner() + html0 + `<div class="panel gpanel"><div class="gtitle">今週の庭<span>${wl.length}輪</span></div>${gardenSVG(wl, false)}</div><div class="panel" style="margin-top:12px">${timeline(logs, true)}${legend()}</div>`;
  for (const [slot,label] of SLOTS){
    const cs = due.filter(c => (c.slot||'any') === slot);
    if (!cs.length) continue;
    const withLogs = cs.map(c => [c, logs.filter(l => l.choreId === c.id)]);
    withLogs.sort((a,b) => (a[1].length>0) - (b[1].length>0));
    html += `<h2 class="s-${slot}">${label}</h2>` + withLogs.map(([c,t]) => choreCard(c,t)).join('');

  const extra = logs.filter(l => !l.choreId || !dueIds.has(l.choreId));
  if (extra.length){
    html += `<h2>ほかにやったこと</h2><div class="panel">` + extra.map(l => `<div class="minirow"><span class="t">${hm(l.at)}</span><span class="dot ${cls(l)}"></span><span class="n">${esc(l.name)}</span>
      ${l.by!==S.me?`<button class="thanks ${l.thanks?'on':''}" data-act="thanks" data-id="${l.id}">${l.thanks?'♥':'♡'}</button>`:(l.thanks?'<span class="thanks on">♥</span>':`<button class="btn small ghost" data-act="undo" data-id="${l.id}">取消</button>`)}</div>`).join('') + `</div>`;
  }
  return html;
}

function viewWeek(){

function viewReview(){
