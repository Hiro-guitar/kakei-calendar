<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="うちの家事">
<meta name="theme-color" content="#faf6ef">
<title>うちの家事</title>
<link rel="apple-touch-icon" href="kaji-icon.png">
<link rel="icon" href="kaji-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#efe6d2; --cream:#fffbed; --paper:#fbf4e2; --navy:#1f526e; --sub:rgba(31,82,110,.62); --line:rgba(31,82,110,.10);
  --brown:#937c60; --amber:#e3a83b; --amber-hi:#f3c15a; --red:#d4665f;
  --h:#2fa39b; --h-soft:#d7efe9; --y:#ec8a6b; --y-soft:#fbe3d9; --any:#b5a68c; --any-soft:#efe7d6;
  --sh:0 6px 16px rgba(31,82,110,.10), 0 2px 4px rgba(31,82,110,.06);
  --sh-lift:0 10px 22px rgba(31,82,110,.14), 0 3px 6px rgba(31,82,110,.08);
  --ink:var(--navy); --card:var(--cream); --accent:var(--navy);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--navy);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-weight:500;font-size:15px}
body{background-color:var(--sand);background-image:radial-gradient(rgba(147,124,96,.13) 1.6px,transparent 1.8px);background-size:18px 18px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
b,strong,h1,h2,h3{font-weight:800}

/* ヘッダー：浮いた名札 */
header{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;background:linear-gradient(var(--sand) 70%,rgba(239,230,210,0))}
.hbar{display:flex;align-items:center;gap:10px;background:var(--cream);border-radius:999px;padding:7px 8px 7px 8px;box-shadow:var(--sh);max-width:640px;margin:0 auto}
header .logo{width:32px;height:32px;border-radius:10px;flex:none}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.02em}
header .date{font-size:12px;color:var(--sub);font-weight:700;margin-left:6px}
.me-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--paper);font-size:13px;font-weight:700}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.dot.h{background:var(--h)} .dot.y{background:var(--y)} .dot.any{background:var(--any)}
.sync{width:9px;height:9px;border-radius:50%;background:#d6cbb5}
.sync.ok{background:#7cc27a}.sync.pending{background:var(--amber)}.sync.err{background:var(--red)}

main{padding:6px 14px calc(110px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}

/* 下のメニュー：角丸の色タイル */
nav.tabs{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;background:var(--cream);border-radius:26px;box-shadow:var(--sh-lift);display:flex;padding:8px 6px;z-index:6}
nav.tabs button{flex:1;padding:2px 0;font-size:11px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
nav.tabs .tile{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;transition:transform .18s cubic-bezier(.3,1.6,.5,1);opacity:.55}
nav.tabs .tile svg{width:22px;height:22px;fill:none;stroke:#fffbed;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[data-t=today] .tile{background:var(--amber)}
nav.tabs button[data-t=week] .tile{background:var(--h)}
nav.tabs button[data-t=review] .tile{background:var(--y)}
nav.tabs button[data-t=settings] .tile{background:var(--brown)}
nav.tabs button.on{color:var(--navy)}
nav.tabs button.on .tile{opacity:1;transform:translateY(-3px) scale(1.06)}
.badge-n{position:absolute;top:-4px;left:calc(50% + 10px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--cream)}

/* 見出し：ちょっと傾いた札 */
h2{display:inline-block;font-size:13px;color:var(--cream);margin:22px 4px 10px;padding:4px 14px;border-radius:999px;background:var(--brown);transform:rotate(-2deg);letter-spacing:.06em;box-shadow:0 2px 0 rgba(31,82,110,.08)}
h2.s-morning{background:var(--amber)} h2.s-day{background:var(--h)} h2.s-night{background:#5b6fa8} h2.s-any{background:var(--brown)}
.panel{background:var(--cream);border-radius:26px;padding:16px;box-shadow:var(--sh)}
.muted{color:var(--sub);font-size:13px}

/* 話しかけてくる吹き出し */
.talk{position:relative;margin:14px 2px 6px;background:var(--cream);border-radius:34px 30px 36px 28px;padding:24px 20px 18px;box-shadow:var(--sh);min-height:86px}
.talk .tag{position:absolute;top:-12px;left:18px;background:var(--amber);color:var(--navy);font-weight:800;font-size:13px;padding:4px 14px;border-radius:999px;transform:rotate(-4deg);box-shadow:0 2px 6px rgba(31,82,110,.12)}
.talk .msg{font-size:16px;line-height:1.7;font-weight:700;min-height:1.7em}
.talk .next{position:absolute;right:20px;bottom:10px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--amber);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}

/* タイムライン */
.tl{position:relative;height:48px;margin:2px 4px 0}
.tl .bar{position:absolute;left:0;right:0;top:18px;height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,#e9dfc9 0 12px,#e2d6bc 12px 24px)}
.tl .now{position:absolute;top:8px;width:4px;height:28px;margin-left:-2px;background:var(--navy);border-radius:2px}
.tl .d{position:absolute;top:13px;width:18px;height:18px;margin-left:-9px;border-radius:50%;border:3px solid var(--cream);box-shadow:0 2px 4px rgba(31,82,110,.18)}
.tl .tick{position:absolute;top:34px;font-size:10px;font-weight:700;color:var(--sub);transform:translateX(-50%)}
.legend{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--sub);margin-top:4px}
.legend span{display:flex;align-items:center;gap:5px}

/* 家事カード */
.card{display:flex;align-items:center;gap:12px;background:var(--cream);border-radius:24px;padding:13px 12px 13px 16px;margin-bottom:10px;box-shadow:var(--sh);position:relative;transition:transform .15s}
.card:active{transform:scale(.985)}
.card .stripe{display:none}
.card .body{flex:1;min-width:0}
.card .name{font-weight:800;font-size:15.5px}
.card .meta{font-size:12px;color:var(--sub);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:700}
.card.done{background:var(--paper);box-shadow:0 2px 6px rgba(31,82,110,.05)}
.card.done .name{color:var(--sub)}
.check{width:44px;height:44px;border-radius:50%;border:3px dashed #d9ccb1;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex:none;background:var(--paper);transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.check:active{transform:scale(.85)}
.check.on{border-style:solid;border-color:transparent}
.check.on.h{background:var(--h)}.check.on.y{background:var(--y)}
.check.pop{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.thanks{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#fff;color:var(--sub);box-shadow:0 1px 3px rgba(31,82,110,.12)}
.thanks.on{background:#ffe9ee;color:#d0546b}
.badge{font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px}
.badge.h{background:var(--h-soft);color:#1f7d76}.badge.y{background:var(--y-soft);color:#c4603f}.badge.any{background:var(--any-soft);color:var(--brown)}
.empty{text-align:center;padding:24px 10px;color:var(--sub);font-size:13px;font-weight:700}

.fab{position:fixed;right:16px;bottom:calc(98px + env(safe-area-inset-bottom));background:linear-gradient(var(--amber-hi),var(--amber));color:var(--navy);border-radius:999px;padding:12px 18px;font-weight:800;box-shadow:var(--sh-lift),inset 0 0 0 2px rgba(255,255,255,.3);z-index:4}
.fab:active{transform:translateY(2px)}
.minirow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:2px dotted var(--line);font-size:14px;font-weight:700}
.minirow:last-child{border-bottom:0}
.minirow .t{color:var(--sub);font-size:12px;width:40px;flex:none}
.minirow .n{flex:1}

/* 週 */
.weeknav{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 12px}
.weeknav button{padding:7px 14px;border-radius:999px;background:var(--cream);box-shadow:var(--sh);font-weight:700}
.weeknav b{background:var(--cream);padding:6px 16px;border-radius:999px;box-shadow:var(--sh)}
.wgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wday{background:var(--cream);border-radius:18px;min-height:122px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;box-shadow:var(--sh)}
.wday.today{box-shadow:0 0 0 3px var(--amber),var(--sh)}
.wday.sel{background:var(--paper);transform:translateY(-2px)}
.wday .wd{font-size:11px;font-weight:700;color:var(--sub)}
.wday .dn{font-size:16px;font-weight:800;margin-bottom:6px}
.wday .dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.wday .dots i{width:9px;height:9px;border-radius:50%;display:block}
.wday .dots i.h{background:var(--h)}.wday .dots i.y{background:var(--y)}

/* 振り返り */
.reveal{width:100%;padding:16px;border-radius:24px;border:3px dashed #d9ccb1;color:var(--sub);background:var(--paper);font-weight:700}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who{border-radius:22px;padding:14px}
.who.h{background:var(--h-soft)}.who.y{background:var(--y-soft)}
.who .nm{font-weight:800;font-size:14px;margin-bottom:6px}
.who ul{margin:0;padding-left:16px;font-size:13px;line-height:1.75}
.note{padding:12px 2px;border-bottom:2px dotted var(--line)}
.note:last-child{border-bottom:0}
.note .txt{font-size:14px;font-weight:700;white-space:pre-wrap}
.note .m{font-size:12px;color:var(--sub);margin-top:6px;display:flex;gap:8px;align-items:center}

/* ボタン */
.btn{padding:11px 18px;border-radius:999px;background:linear-gradient(#3b7394,var(--navy));color:var(--cream);font-weight:800;box-shadow:0 3px 8px rgba(31,82,110,.2),inset 0 0 0 2px rgba(255,255,255,.18)}
.btn:active{transform:translateY(2px)}
.btn.go{background:linear-gradient(var(--amber-hi),var(--amber));color:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(31,82,110,.12)}
.btn.small{padding:6px 12px;font-size:12px}
.btn.danger{background:#fff;color:var(--red);box-shadow:inset 0 0 0 2px #f1cdc9}
.btn.wide{width:100%;padding:14px}
.row{display:flex;gap:8px;align-items:center}
.list-item{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:2px dotted var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .n{flex:1;min-width:0;font-weight:700}
.list-item .n small{display:block;color:var(--sub);font-size:12px}
.ord{display:flex;flex-direction:column}
.ord button{font-size:11px;color:var(--sub);padding:1px 6px}
label.f{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:16px 0 6px}
input.t,textarea.t,select.t{width:100%;padding:12px 14px;border-radius:18px;border:0;background:#fff;outline:none;box-shadow:inset 0 0 0 2px var(--line);font-weight:700}
input.t:focus,textarea.t:focus{box-shadow:inset 0 0 0 2px var(--amber)}
textarea.t{min-height:72px;resize:vertical}
.seg{display:flex;background:var(--paper);border-radius:999px;padding:4px;gap:3px;box-shadow:inset 0 0 0 2px var(--line)}
.seg button{flex:1;padding:8px 4px;border-radius:999px;font-size:13px;font-weight:700;color:var(--sub)}
.seg button.on{background:linear-gradient(var(--amber-hi),var(--amber));color:var(--navy);box-shadow:0 2px 5px rgba(31,82,110,.15)}
.days{display:flex;gap:5px;margin-top:8px}
.days button{flex:1;padding:9px 0;border-radius:14px;background:#fff;font-size:13px;font-weight:700;box-shadow:inset 0 0 0 2px var(--line)}
.days button.on{background:var(--navy);color:var(--cream);box-shadow:none}

/* シート：下からせり上がるメモ帳 */
.scrim{position:fixed;inset:0;background:rgba(31,82,110,.30);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:8px;right:8px;bottom:8px;z-index:21;background:var(--cream);border-radius:32px;max-height:86vh;overflow:auto;padding:14px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .32s cubic-bezier(.3,1.25,.5,1);max-width:620px;margin:0 auto;box-shadow:var(--sh-lift)}
.sheet.open{transform:none}
.sheet .grab{display:none}
.sheet .x{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:16px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);z-index:2}
.sheet h3{margin:4px 0 6px;font-size:20px}
.defs{list-style:none;padding:0;margin:8px 0 0}
.defs li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:2px dotted var(--line);font-size:14px;font-weight:700}
.defs li:last-child{border-bottom:0}
.defs li .bx{width:22px;height:22px;border-radius:8px;box-shadow:inset 0 0 0 2px #d9ccb1;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.defs li.on .bx{background:var(--h);box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chips button{padding:7px 13px;border-radius:999px;background:#fff;font-size:13px;font-weight:700;box-shadow:0 2px 5px rgba(31,82,110,.1)}
.chips button:active{transform:scale(.95)}

/* トースト：小さな吹き出し */
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px) scale(.9);background:var(--cream);color:var(--navy);padding:12px 20px;border-radius:24px;font-size:14px;font-weight:800;opacity:0;transition:all .25s cubic-bezier(.3,1.6,.5,1);z-index:30;pointer-events:none;white-space:nowrap;box-shadow:var(--sh-lift)}
.toast::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:var(--cream)}
.toast.show{opacity:1;transform:translateX(-50%)}

/* きらきら */
.spark{position:fixed;width:10px;height:10px;pointer-events:none;z-index:40;animation:spark .7s ease-out forwards}
.spark.star{background:var(--amber-hi);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.spark.leaf{background:#8fcf7e;border-radius:0 70% 0 70%}
.spark.heart{color:#e2657e;font-size:16px;width:auto;height:auto;font-weight:800}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.6) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(160deg)}}

.onboard{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.onboard .big{padding:22px;border-radius:999px;font-size:18px;font-weight:800;color:#fff;box-shadow:var(--sh-lift)}
.onboard .big.h{background:var(--h)}.onboard .big.y{background:var(--y)}
.hint{font-size:12px;color:var(--sub);line-height:1.7;margin-top:8px;font-weight:700}
.dot.both,.wday .dots i.both,.check.on.both{background:linear-gradient(90deg,var(--h) 50%,var(--y) 50%);border-color:transparent}
.join{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:2px dashed #d9ccb1;color:var(--sub);background:#fff}
.togglerow{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;font-weight:700}
.togglerow input{width:20px;height:20px;accent-color:var(--h)}
</style>
</head>
<body>
<header><div class="hbar">
  <img class="logo" src="kaji-icon.png" alt="">
  <h1>うちの家事<span class="date" id="hdate"></span></h1>
  <span class="sync" id="sync" title="同期"></span>
  <button class="me-chip" id="mechip"></button>
</div></header>
<main id="view"></main>
<button class="fab" id="fab">＋ 名もなき家事</button>
<nav class="tabs" id="tabs">
  <button data-t="today"><span class="tile"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg></span>今日</button>
  <button data-t="week"><span class="tile"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="3.5"/><path d="M8 3.5v4M16 3.5v4M4 10.5h16"/><circle cx="9" cy="15" r=".6"/><circle cx="15" cy="15" r=".6"/></svg></span>週</button>
  <button data-t="review"><span class="tile"><svg viewBox="0 0 24 24"><path d="M5 6.5c0-1.4 1.1-2.5 2.5-2.5h9c1.4 0 2.5 1.1 2.5 2.5v7c0 1.4-1.1 2.5-2.5 2.5H11l-4 3.5V16h0c-1.1 0-2-.9-2-2z"/><path d="M9 9h6M9 12h4"/></svg></span>振り返り</button>
  <button data-t="settings"><span class="tile"><svg viewBox="0 0 24 24"><path d="M14.5 5.5a3.5 3.5 0 0 0-4.6 4.4L4.5 15.3a1.8 1.8 0 0 0 2.5 2.6l5.4-5.4a3.5 3.5 0 0 0 4.5-4.6l-2.1 2.1-2-.5-.5-2z"/></svg></span>設定</button>
</nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ========== 状態 ========== */
const LS = 'uchikaji.v1';
const SLOTS = [['morning','朝'],['day','昼'],['night','夜'],['any','いつでも']];
const WD = ['日','月','火','水','木','金','土'];
let S = (() => { try { return JSON.parse(localStorage.getItem(LS)) } catch(e) { return null } })()
  || { items:{}, me:null, url:'', key:'', lastSync:0, queue:[], seeded:false };
let tab = 'today', weekOff = 0, selDay = null, reviewOpen = false, syncState = 'local';

const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)) } catch(e) {} };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const all = kind => Object.values(S.items).filter(i => i.kind === kind && !i.deleted);
const $ = id => document.getElementById(id);

function put(item){
  item.updatedAt = Date.now();
  S.items[item.id] = item;
  S.queue = S.queue.filter(q => q.id !== item.id);
  S.queue.push(item);
  save(); render(); push();
}
const remove = item => put({ ...item, deleted:true });

function settings(){
  return S.items.settings || { id:'settings', kind:'settings', names:{ h:'拓輝', y:'佑理' } };
}
const nm = k => k === 'any' ? 'どちらでも' : (settings().names[k] || k);
const other = k => k === 'h' ? 'y' : 'h';

/* ========== 日付 ========== */
const pad = n => String(n).padStart(2,'0');
const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` };
const hm = ts => { const d = new Date(ts); return `${d.getHours()}:${pad(d.getMinutes())}` };
const startOfDay = ts => { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime() };
const daysBetween = (a,b) => Math.round((startOfDay(b) - startOfDay(a)) / 864e5);
function weekStart(off){ const d = new Date(); d.setHours(0,0,0,0); const dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow+off*7); return d; }

/* ========== 家事ロジック ========== */
function choresSorted(){ return all('chore').sort((a,b) => (a.order??0) - (b.order??0)); }
function logsOn(key){ return all('log').filter(l => dayKey(l.at) === key).sort((a,b) => a.at - b.at); }
function lastDone(cid){ let m = 0; for (const l of all('log')) if (l.choreId === cid && l.at > m) m = l.at; return m; }
function isDueToday(c){
  const now = Date.now(), f = c.freq || { type:'daily' };
  if (f.type === 'daily') return true;
  if (f.type === 'weekly') return (f.days||[]).includes(new Date().getDay());
  if (f.type === 'interval'){
    const ld = lastDone(c.id);
    if (!ld) return true;
    if (dayKey(ld) === dayKey(now)) return true;
    return daysBetween(ld, now) >= (f.n || 1);
  }
  return true;
}
function freqText(c){
  const f = c.freq || { type:'daily' };
  if (f.type === 'daily') return '毎日';
  if (f.type === 'weekly') return (f.days||[]).slice().sort().map(d => WD[d]).join('・') + '曜';
  if (f.type === 'interval') return `${f.n||1}日ごと`;
  return '';
}

let popId = null, talkIdx = 0, lastTyped = '', typeT = null, html0 = '';
function talkMsg(due, logs){
  const me = S.me, h = new Date().getHours();
  const greet = h < 5 ? '夜ふかしだね。' : h < 10 ? 'おはよう！' : h < 17 ? 'こんにちは！' : 'おつかれさま！';
  const doneIds = new Set(logs.map(l => l.choreId));
  const left = due.filter(c => !doneIds.has(c.id));
  const mine = left.filter(c => c.owner === me).length;
  const fromOther = logs.filter(l => l.by !== me && !l.thanks);
  const openNotes = all('note').filter(n => n.status !== 'done').length;
  const msgs = [];
  if (!due.length) msgs.push(`${greet} 家事を登録すると、ここで今日の様子をお知らせするね。`);
  else if (!left.length) msgs.push(`今日の家事はぜんぶ終わり！ おつかれさま。あとはゆっくりしよう。`);
  else msgs.push(`${greet} 今日の家事は、あと${left.length}つ。${nm(me)}の担当は${mine ? mine + 'つ' : 'もう終わり'}だよ。`);
  if (fromOther.length) msgs.push(`${nm(other(me))}が今日${fromOther.length}つやってくれたみたい。♡ありがとう、送ってみる？`);
  if (openNotes) msgs.push(`改善ボックスに${openNotes}つ入ってるよ。週に1回、ふたりで見てみよう。`);
  msgs.push(['気になったことは、その場で言わずに改善ボックスへ入れておこう。','小さな家事も「名もなき家事」から残せるよ。','一緒にやった家事は「ふたりで」を押してね。','「完了の定義」はふたりで決めて、ときどき見直そう。'][new Date().getDate() % 4]);
  return msgs[talkIdx % msgs.length];
}
function typeTalk(){
  const el = document.querySelector('.talk .msg'); if (!el) return;
  const full = el.dataset.full;
  clearInterval(typeT);
  if (full === lastTyped) { el.textContent = full; return; }
  lastTyped = full; let i = 0; el.textContent = '';
  typeT = setInterval(() => { i += 1; el.textContent = full.slice(0, i); if (i >= full.length) clearInterval(typeT); }, 38);
}
let actx;
function chime(kind){
  if (S.sound === false) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === 'thanks' ? [988, 1319] : kind === 'undo' ? [587, 440] : [784, 1175];
    notes.forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = f;
      const t = actx.currentTime + i * 0.09; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.13, t + 0.012); g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.42); });
  } catch(e) {}
}
function burst(el, kind){
  if (!el) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  const n = kind === 'heart' ? 6 : 10;
  for (let i = 0; i < n; i++){
    const s = document.createElement('span'), a = Math.random() * Math.PI * 2, d = 28 + Math.random() * 30;
    s.className = 'spark ' + (kind === 'heart' ? 'heart' : (i % 2 ? 'star' : 'leaf'));
    if (kind === 'heart') s.textContent = '♥';
    s.style.left = cx + 'px'; s.style.top = cy + 'px';
    s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', (Math.sin(a) * d - (kind === 'heart' ? 34 : 0)) + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 760);
  }
}
const cls = l => l.both ? 'both' : l.by;
const bg = l => l.both ? 'linear-gradient(90deg,var(--h) 50%,var(--y) 50%)' : `var(--${l.by})`;
const whoText = l => l.both ? 'ふたりで' : nm(l.by);

    C('kid_am','子どもの支度','y','morning',{type:'daily'},['着替え・持ち物をそろえる','連絡帳を確認']),

    C('laundry_in','洗濯物の取り込み・たたむ','h','day',{type:'daily'},['たたんで各自の場所にしまう']),
    C('dinner','夕飯づくり','y','night',{type:'daily'},['食卓に並べる','コンロ周りをさっと拭く']),
    C('dish_pm','夜の洗い物','h','night',{type:'daily'},['シンクに何も残っていない','排水口のゴミを捨てる','台を拭く']),
    C('bath_clean','お風呂掃除','h','night',{type:'daily'},['浴槽を洗ってお湯はりまで','床の髪の毛を取る']),
    C('kid_bath','子どものお風呂','y','night',{type:'daily'},['体を洗って保湿まで']),
    C('trash','ゴミ出し','h','morning',{type:'weekly',days:[1,4]},['家中のゴミ箱を集める','新しい袋をセット']),
    C('vacuum','掃除機','any','any',{type:'interval',n:3},['リビングと寝室','コードを片付ける']),
    C('toilet','トイレ掃除','h','any',{type:'weekly',days:[6]},['便器の中と便座','床を拭く','ペーパーの補充']),
    C('shopping','買い出し','any','any',{type:'weekly',days:[0,3]},['リストのものを買う','冷蔵庫にしまう']),
    C('sheets','シーツ・枕カバー交換','any','any',{type:'interval',n:14},['外して洗濯','新しいものを付ける']),
  ];
  list.forEach((c,i) => { c.order = i; c.updatedAt = 1; S.items[c.id] = c; S.queue.push(c); });
  S.seeded = true; save();
}

/* ========== 同期（GAS） ========== */
let pushing = false;
async function push(){
  if (!S.url || pushing || !S.queue.length) { setSync(); return; }
  pushing = true; setSync('pending');
  const batch = S.queue.slice();
  try {
    const r = await fetch(S.url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ key:S.key, items:batch }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'error');
    const sent = new Map(batch.map(b => [b.id, b.updatedAt]));
    S.queue = S.queue.filter(q => sent.get(q.id) !== q.updatedAt);
    save(); syncState = 'ok';
  } catch(e) { syncState = 'err'; }
  pushing = false; setSync();
  if (S.queue.length && syncState === 'ok') push();
}
async function pull(){
  if (!S.url) { setSync(); return false; }
  try {
    const since = Math.max(0, (S.lastSync||0) - 60000);
    const r = await fetch(`${S.url}?key=${encodeURIComponent(S.key)}&since=${since}`);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'error');
    for (const it of j.items){
      const cur = S.items[it.id];
      if (!cur || (it.updatedAt||0) >= (cur.updatedAt||0)) S.items[it.id] = it;
    }
    S.lastSync = j.now; save(); syncState = 'ok'; setSync();
    return true;
  } catch(e) { syncState = 'err'; setSync(); return false; }
}
async function sync(){
  const ok = await pull();
  if (ok && !S.seeded) seedIfEmpty();
  await push();
  render();
}
function setSync(s){
  const el = $('sync');
  const st = s || (!S.url ? 'local' : S.queue.length ? (syncState==='err'?'err':'pending') : syncState);
  el.className = 'sync ' + (st==='ok'?'ok':st==='pending'?'pending':st==='err'?'err':'');
  el.title = { local:'この端末だけに保存中', ok:'同期済み', pending:'同期待ち', err:'同期エラー' }[st] || '';
}

/* ========== 描画 ========== */
function render(){
  const now = new Date();
  $('hdate').textContent = `${now.getMonth()+1}/${now.getDate()}（${WD[now.getDay()]}）`;
  const me = S.me;
  $('mechip').innerHTML = me ? `<span class="dot ${me}"></span>${esc(nm(me))}` : '未設定';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('fab').style.display = (me && tab === 'today') ? '' : 'none';
  const v = $('view');
  if (!me) { v.innerHTML = viewOnboard(); return; }
  v.innerHTML = { today:viewToday, week:viewWeek, review:viewReview, settings:viewSettings }[tab]();
  const rb = document.querySelector('#tabs button[data-t=review]'); rb.querySelector('.badge-n')?.remove();
  const on = all('note').filter(n => n.status !== 'done').length;
  if (on) rb.insertAdjacentHTML('beforeend', `<span class="badge-n">${on}</span>`);
  typeTalk();
  setSync();
}

function viewOnboard(){
  const n = settings().names;
  return `<div class="onboard">
    <div style="font-size:20px;font-weight:700">この端末を使うのは？</div>
    <div class="muted">あとから設定で変えられます</div>

    <button class="big y" data-act="setme" data-k="y">${esc(n.y)}</button>
  </div>`;

function timeline(logs, showNow){
  const now = new Date(), nowMin = now.getHours()*60 + now.getMinutes();
  const ticks = [0,6,12,18,24].map(h => `<span class="tick" style="left:${h/24*100}%">${h}</span>`).join('');
  const dots = logs.map(l => { const d = new Date(l.at); const m = d.getHours()*60 + d.getMinutes();
    return `<span class="d" style="left:${m/1440*100}%;background:${bg(l)}" title="${esc(hm(l.at)+' '+l.name)}"></span>` }).join('');
  return `<div class="tl"><div class="bar"></div>${ticks}${showNow?`<span class="now" style="left:${nowMin/1440*100}%"></span>`:''}${dots}</div>`;
}
const legend = () => `<div class="legend"><span><i class="dot h"></i>${esc(nm('h'))}</span><span><i class="dot y"></i>${esc(nm('y'))}</span></div>`;

function choreCard(c, todays){
  const done = todays.length > 0;
  const last = todays[todays.length-1];
  let meta = `<span class="badge ${c.owner}">${esc(nm(c.owner))}</span>`;
  if (done){
    meta = `<span>✓ ${hm(last.at)} ${esc(whoText(last))}</span>`;
    if (!last.both && last.by !== S.me) meta += `<button class="join" data-act="join" data-id="${last.id}">＋一緒にやった</button>`;
    if (last.by !== S.me) meta += `<button class="thanks ${last.thanks?'on':''}" data-act="thanks" data-id="${last.id}">${last.thanks?'♥ ありがとう済':'♡ ありがとう'}</button>`;
    else if (last.thanks) meta += `<span class="thanks on">♥ ありがとうが届いてる</span>`;
  }
  const ck = done ? (last.by === S.me
      ? `<button class="check on ${cls(last)} ${last.id===popId?'pop':''}" data-act="uncheck" data-id="${last.id}" aria-label="取り消す">✓</button>`
      : last.both
        ? `<button class="check on both" data-act="leave" data-id="${last.id}" aria-label="一緒から外れる">✓</button>`
        : `<button class="check on ${last.by}" data-act="notmine" aria-label="${esc(nm(last.by))}の記録">✓</button>`) : `<button class="check" data-act="do" data-id="${c.id}" aria-label="やった"></button>`;
  return `<div class="card ${done?'done':''}"><span class="stripe ${c.owner}"></span>
    <div class="body" data-act="open" data-id="${c.id}"><div class="name">${esc(c.name)}</div><div class="meta">${meta}</div></div>${ck}</div>`;
}

function viewToday(){
  const tk = dayKey(Date.now());
  const logs = logsOn(tk);
  const chores = choresSorted();
  const due = chores.filter(isDueToday);
  const dueIds = new Set(due.map(c => c.id));
  html0 = `<div class="talk" data-act="talk"><span class="tag">おうち</span><div class="msg" data-full="${esc(talkMsg(due, logs))}"></div><span class="next"></span></div>`;
  let html = html0 + `<div class="panel">${timeline(logs, true)}${legend()}</div>`;
  for (const [slot,label] of SLOTS){
    const cs = due.filter(c => (c.slot||'any') === slot);
    if (!cs.length) continue;
    const withLogs = cs.map(c => [c, logs.filter(l => l.choreId === c.id)]);
    withLogs.sort((a,b) => (a[1].length>0) - (b[1].length>0));
    html += `<h2 class="s-${slot}">${label}</h2>` + withLogs.map(([c,t]) => choreCard(c,t)).join('');
  }
  if (!due.length) html += `<div class="empty">今日の家事はまだ登録されていません。<br>設定から追加できます。</div>`;
  const extra = logs.filter(l => !l.choreId || !dueIds.has(l.choreId));
  if (extra.length){
    html += `<h2>ほかにやったこと</h2><div class="panel">` + extra.map(l => `<div class="minirow"><span class="t">${hm(l.at)}</span><span class="dot ${cls(l)}"></span><span class="n">${esc(l.name)}</span>
      ${l.by!==S.me?`<button class="thanks ${l.thanks?'on':''}" data-act="thanks" data-id="${l.id}">${l.thanks?'♥':'♡'}</button>`:(l.thanks?'<span class="thanks on">♥</span>':`<button class="btn small ghost" data-act="undo" data-id="${l.id}">取消</button>`)}</div>`).join('') + `</div>`;
  }
  return html;
}

function viewWeek(){
  const ws = weekStart(weekOff);
  const tk = dayKey(Date.now());
  const days = [...Array(7)].map((_,i) => { const d = new Date(ws); d.setDate(ws.getDate()+i); return d; });
  const label = `${ws.getMonth()+1}/${ws.getDate()} 〜 ${days[6].getMonth()+1}/${days[6].getDate()}`;
  let html = `<div class="weeknav"><button data-act="wk" data-d="-1">‹ 前</button><b>${weekOff===0?'今週':label}</b><button data-act="wk" data-d="1" ${weekOff>=0?'disabled style="opacity:.3"':''}>次 ›</button></div>`;
  html += `<div class="wgrid">` + days.map(d => {
    const k = dayKey(d.getTime()); const logs = logsOn(k);
    return `<button class="wday ${k===tk?'today':''} ${k===selDay?'sel':''}" data-act="selday" data-k="${k}">
      <span class="wd">${WD[d.getDay()]}</span><span class="dn">${d.getDate()}</span>
      <span class="dots">${logs.map(l => `<i class="${cls(l)}"></i>`).join('')}</span></button>`;
  }).join('') + `</div><div style="margin-top:8px">${legend()}</div>`;
  const k = selDay && days.some(d => dayKey(d.getTime()) === selDay) ? selDay : null;
  if (k){
    const logs = logsOn(k);
    html += `<h2>${k.slice(5).replace('-','/')} の家事</h2><div class="panel">${timeline(logs, k===tk)}`;
    html += logs.length ? logs.map(l => `<div class="minirow"><span class="t">${hm(l.at)}</span><span class="dot ${cls(l)}"></span><span class="n">${esc(l.name)}${l.thanks?' <span style="color:#d0546b">♥</span>':''}</span></div>`).join('') : `<div class="empty">記録なし</div>`;
    html += `</div>`;
  } else {
    html += `<p class="hint">日付をタップすると、その日の流れが見られます。</p>`;
  }
  return html;
}

function viewReview(){
  const ws = weekStart(weekOff), we = new Date(ws); we.setDate(ws.getDate()+7);
  const logs = all('log').filter(l => l.at >= ws.getTime() && l.at < we.getTime());
  const notes = all('note').sort((a,b) => b.at - a.at);
  const open = notes.filter(n => n.status !== 'done'), closed = notes.filter(n => n.status === 'done');
  let html = `<div class="weeknav"><button data-act="wk" data-d="-1">‹ 前</button><b>${weekOff===0?'今週の振り返り':`${ws.getMonth()+1}/${ws.getDate()}の週`}</b><button data-act="wk" data-d="1" ${weekOff>=0?'disabled style="opacity:.3"':''}>次 ›</button></div>`;

  html += `<h2>改善ボックス（${open.length}）</h2><div class="panel">`;
  html += open.length ? open.map(n => noteRow(n)).join('') : `<div class="empty">まだありません</div>`;
  html += `<div style="margin-top:10px"><textarea class="t" id="newnote" placeholder="気になったこと・こうしたいこと（その場で言わずにここへ）"></textarea>
    <div class="row" style="margin-top:8px;justify-content:flex-end"><button class="btn small" data-act="addnote">入れる</button></div></div></div>`;

  html += `<h2>ふたりの1週間</h2>`;
  if (!reviewOpen){
    html += `<button class="reveal" data-act="reveal">ふたりで見るときにタップ<br><small>件数は振り返りの材料。比べるためではなく、担当を組み替えるために使う</small></button>`;
  } else {
    const per = k => { const m = {}; logs.filter(l => involves(l,k)).forEach(l => m[l.name] = (m[l.name]||0)+1); return Object.entries(m).sort((a,b) => b[1]-a[1]); };
    const thx = k => logs.filter(l => l.by === k && l.thanks).length;
    html += `<div class="split">` + ['h','y'].map(k => `<div class="who ${k}"><div class="nm">${esc(nm(k))}</div>
      <ul>${per(k).map(([n,c]) => `<li>${esc(n)}${c>1?` ×${c}`:''}</li>`).join('') || '<li style="list-style:none;margin-left:-16px" class="muted">記録なし</li>'}</ul>
      <div class="muted" style="margin-top:6px">♥ もらったありがとう ${thx(k)}</div></div>`).join('') + `</div>`;
    const nameless = logs.filter(l => !l.choreId);
    if (nameless.length) html += `<p class="hint">名もなき家事 ${nameless.length}件：${nameless.map(l => esc(l.name)).join('、')}</p>`;
    html += `<p class="hint">偏りを感じたら、設定で担当を組み替えましょう。完了の定義もこのタイミングで見直せます。</p>`;
  }
  if (closed.length){
    html += `<h2>話したこと</h2><div class="panel">` + closed.slice(0,20).map(n => noteRow(n)).join('') + `</div>`;
  }
  return html;
}
function noteRow(n){

    <div class="m"><span class="dot ${n.by}"></span>${esc(nm(n.by))}・${dayKey(n.at).slice(5).replace('-','/')}${c?`・${esc(c.name)}`:''}

    ${n.by===S.me?`<button class="btn small ghost" data-act="delnote" data-id="${n.id}">削除</button>`:''}</div></div>`;
}

  const n = settings().names;
  let html = `<h2>家事リスト</h2><div class="panel">`;
  const cs = choresSorted();
  html += cs.map((c,i) => `<div class="list-item"><span class="stripe ${c.owner}" style="width:5px;height:34px;border-radius:3px"></span>

    || `<div class="empty">家事がありません</div>`;
  html += `<button class="btn go wide" style="margin-top:12px" data-act="edit" data-id="">＋ 家事を追加</button></div>`;

  html += `<h2>ふたりの名前</h2><div class="panel">
    <div class="row"><span class="dot h"></span><input class="t" id="name_h" value="${esc(n.h)}"></div>
    <div class="row" style="margin-top:8px"><span class="dot y"></span><input class="t" id="name_y" value="${esc(n.y)}"></div>
    <div class="row" style="margin-top:10px;justify-content:flex-end"><button class="btn small" data-act="savenames">保存</button></div></div>`;

  html += `<h2>この端末を使う人</h2><div class="panel"><div class="seg">
    <button class="${S.me==='h'?'on':''}" data-act="setme" data-k="h">${esc(n.h)}</button>
    <button class="${S.me==='y'?'on':''}" data-act="setme" data-k="y">${esc(n.y)}</button></div></div>`;

  html += `<h2>同期（Google Apps Script）</h2><div class="panel">
    <label class="f" style="margin-top:0">ウェブアプリURL</label><input class="t" id="s_url" value="${esc(S.url)}" placeholder="https://script.google.com/macros/s/…/exec">
    <label class="f">合言葉（Code.gsのKEYと同じもの）</label><input class="t" id="s_key" value="${esc(S.key)}">
    <div class="row" style="margin-top:10px;justify-content:flex-end;gap:8px"><span class="muted" id="syncmsg" style="flex:1">${S.url?(S.lastSync?`最終同期 ${hm(S.lastSync)}`:'未同期'):'未設定（この端末だけに保存中）'}</span>
    <button class="btn small" data-act="savesync">保存して同期</button></div>
    <p class="hint">2台のスマホで同じURLと合言葉を入れると、記録が共有されます。</p></div>`;

  html += `<h2>おと</h2><div class="panel"><div class="seg">
    <button class="${S.sound!==false?'on':''}" data-act="sound" data-v="1">鳴らす</button>
    <button class="${S.sound===false?'on':''}" data-act="sound" data-v="0">鳴らさない</button></div></div>`;
  html += `<h2>バックアップ</h2><div class="panel row"><button class="btn small ghost" data-act="export">書き出す（JSON）</button><span class="muted">全データをファイルに保存</span></div>`;
  return html;
}

/* ========== シート ========== */
function openSheet(html){ $('sheet').innerHTML = `<button class="x" data-act="close" aria-label="閉じる">✕</button>` + html; $('sheet').classList.add('open'); $('scrim').classList.add('open'); }
function closeSheet(){ $('sheet').classList.remove('open'); $('scrim').classList.remove('open'); }

function sheetChore(id){
  const c = S.items[id]; if (!c) return;
  const tl = logsOn(dayKey(Date.now())).filter(l => l.choreId === id);
  const ld = lastDone(id);
  let h = `<h3>${esc(c.name)}</h3><div class="meta muted" style="display:flex;gap:8px;align-items:center"><span class="badge ${c.owner}">担当：${esc(nm(c.owner))}</span>${freqText(c)}${ld&&!tl.length?`・前回 ${dayKey(ld).slice(5).replace('-','/')}`:''}</div>`;
  h += `<label class="f">完了の定義</label>`;
  h += (c.def||[]).length ? `<ul class="defs">${c.def.map((d,i) => `<li data-act="tick"><span class="bx">✓</span><span>${esc(d)}</span></li>`).join('')}</ul>` : `<p class="muted">まだ決まっていません（編集から追加）</p>`;
  h += `<div class="row" style="margin-top:16px"><button class="btn go" style="flex:2;padding:13px" data-act="do" data-id="${c.id}" data-close="1">やった！</button><button class="btn ghost" style="flex:1;padding:13px" data-act="doboth" data-id="${c.id}" data-close="1">ふたりで</button></div>`;
  if (tl.length){
    h += `<label class="f">今日の記録</label><div class="panel">` + tl.map(l => `<div class="minirow"><span class="t">${hm(l.at)}</span><span class="dot ${cls(l)}"></span><span class="n">${esc(whoText(l))}</span>${l.by===S.me?`<button class="btn small ghost" data-act="undo" data-id="${l.id}" data-close="1">取り消す</button>`:''}</div>`).join('') + `</div>`;
  }
  h += `<label class="f">改善ボックスに入れる（その場で言わずに、週1で話す）</label><textarea class="t" id="cnote" placeholder="例：排水口のゴミも捨ててほしい"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn ghost" style="flex:1" data-act="edit" data-id="${c.id}">家事を編集</button><button class="btn" style="flex:1" data-act="addcnote" data-id="${c.id}">入れる</button></div>`;
  openSheet(h);
}

let draft = null;
function sheetEdit(id){
  const c = id ? S.items[id] : null;
  draft = c ? JSON.parse(JSON.stringify(c)) : { id:uid(), kind:'chore', name:'', owner:S.me||'any', slot:'any', freq:{type:'daily'}, def:['','',''], order: (Math.max(-1,...all('chore').map(x=>x.order??0))+1), _new:true };
  while ((draft.def||[]).length < 3) (draft.def = draft.def||[]).push('');
  renderEdit();
}
function renderEdit(){
  const d = draft, f = d.freq || {type:'daily'};
  const seg = (field, opts, cur) => `<div class="seg">${opts.map(([v,l]) => `<button class="${cur===v?'on':''}" data-act="dset" data-f="${field}" data-v="${v}">${esc(l)}</button>`).join('')}</div>`;
  let h = `<h3>${d._new?'家事を追加':'家事を編集'}</h3>
    <label class="f">名前</label><input class="t" id="e_name" value="${esc(d.name)}" placeholder="例：夜の洗い物">
    <label class="f">担当</label>${seg('owner',[['h',nm('h')],['y',nm('y')],['any','どちらでも']],d.owner)}
    <label class="f">時間帯</label>${seg('slot',SLOTS,d.slot||'any')}
    <label class="f">頻度</label>${seg('ftype',[['daily','毎日'],['weekly','曜日'],['interval','◯日ごと']],f.type)}`;
  if (f.type === 'weekly') h += `<div class="days">${[1,2,3,4,5,6,0].map(i => `<button class="${(f.days||[]).includes(i)?'on':''}" data-act="dday" data-v="${i}">${WD[i]}</button>`).join('')}</div>`;
  if (f.type === 'interval') h += `<div class="row" style="margin-top:8px"><input class="t" id="e_n" type="number" min="1" max="60" value="${f.n||3}" style="width:90px"><span>日ごと</span></div>`;
  h += `<label class="f">完了の定義（ここまでやったら完了、を短く）</label>` +
    d.def.map((x,i) => `<input class="t e_def" style="margin-bottom:6px" value="${esc(x)}" placeholder="${['例：シンクに何も残っていない','例：台を拭く','（任意）'][i]||'（任意）'}">`).join('') +
    `<button class="btn small ghost" data-act="addline">＋ 行を追加</button>`;
  h += `<div class="row" style="margin-top:18px"><button class="btn ghost" style="flex:1" data-act="close">キャンセル</button><button class="btn go" style="flex:2" data-act="saveedit">保存</button></div>`;
  if (!d._new) h += `<button class="btn danger wide" style="margin-top:10px" data-act="delchore" id="delbtn">この家事を削除</button>`;
  openSheet(h);
}
function captureEdit(){
  if (!draft) return;
  const n = $('e_name'); if (n) draft.name = n.value;
  const en = $('e_n'); if (en) draft.freq.n = Math.max(1, parseInt(en.value)||1);
  const defs = [...document.querySelectorAll('.e_def')].map(i => i.value);
  if (defs.length) draft.def = defs;
}

function sheetFree(){
  freeBoth = false;
  const recent = [...new Set(all('log').filter(l => !l.choreId).sort((a,b) => b.at-a.at).map(l => l.name))].slice(0,8);
  const base = ['洗剤・ティッシュの補充','保育園・幼稚園の連絡','ゴミ袋をセット','郵便物の整理','水筒を洗う','植物の水やり'];
  const chips = [...new Set([...recent, ...base])].slice(0,12);
  openSheet(`<h3>名もなき家事</h3><p class="muted">小さいけど誰かがやってること、ワンタップで残そう</p>
    <div class="chips">${chips.map(c => `<button data-act="free" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <label class="togglerow"><input type="checkbox" id="freeboth" ${freeBoth?'checked':''}>ふたりでやった</label>
    <label class="f">自由に入力</label><div class="row"><input class="t" id="freein" placeholder="例：網戸の掃除"><button class="btn" data-act="freein">記録</button></div>`);
}

/* ========== イベント ========== */
let toastT;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  const L = id && S.items[id];
  switch(a){
    case 'setme': S.me = el.dataset.k; save(); render(); break;
    case 'talk': talkIdx++; lastTyped = ''; render(); break;
    case 'do': burst(el, 'star'); doChore(S.items[id]); if (el.dataset.close) closeSheet(); break;
    case 'open': sheetChore(id); break;
    case 'thanks': if (!L.thanks) burst(el, 'heart'); toggleThanks(L); break;
    case 'undo': remove(L); toast('取り消しました'); if (el.dataset.close) closeSheet(); break;
    case 'doboth': burst(el, 'star'); doChore(S.items[id], true); if (el.dataset.close) closeSheet(); break;
    case 'join': put({ ...L, both:true }); toast('一緒にやったにしました'); break;
    case 'leave': put({ ...L, both:false }); toast('一緒から外れました'); break;
    case 'uncheck': chime('undo'); remove(L); toast('チェックを外しました'); break;
    case 'notmine': toast('相手がつけたチェックは外せません'); break;
    case 'sound': S.sound = el.dataset.v === '1'; save(); render(); if (S.sound) chime('do'); break;
    case 'tick': el.classList.toggle('on'); break;
    case 'free': doFree(el.dataset.v); closeSheet(); break;
    case 'freein': doFree($('freein').value); closeSheet(); break;
    case 'wk': weekOff = Math.min(0, weekOff + Number(el.dataset.d)); selDay = null; reviewOpen = false; render(); break;
    case 'selday': selDay = selDay === el.dataset.k ? null : el.dataset.k; render(); break;
    case 'reveal': reviewOpen = true; render(); break;
    case 'addnote': { const t = $('newnote').value.trim(); if (!t) return; put({ id:uid(), kind:'note', by:S.me, text:t, choreId:null, at:Date.now(), status:'open' }); toast('改善ボックスに入れました'); break; }
    case 'addcnote': { const t = $('cnote').value.trim(); if (!t) return; put({ id:uid(), kind:'note', by:S.me, text:t, choreId:id, at:Date.now(), status:'open' }); closeSheet(); toast('改善ボックスに入れました'); break; }
    case 'closenote': put({ ...L, status:'done' }); break;
    case 'reopen': put({ ...L, status:'open' }); break;
    case 'delnote': remove(L); break;
    case 'edit': sheetEdit(id); break;
    case 'dset': captureEdit(); { const f = el.dataset.f, v = el.dataset.v;
      if (f === 'ftype') { draft.freq = { type:v, days: draft.freq.days || [new Date().getDay()], n: draft.freq.n || 3 }; }
      else draft[f] = v; } renderEdit(); break;
    case 'dday': captureEdit(); { const v = Number(el.dataset.v), ds = new Set(draft.freq.days||[]); ds.has(v) ? ds.delete(v) : ds.add(v); draft.freq.days = [...ds]; } renderEdit(); break;
    case 'addline': captureEdit(); draft.def.push(''); renderEdit(); break;
    case 'saveedit': { captureEdit(); const d = { ...draft }; d.name = (d.name||'').trim();
      if (!d.name) { toast('名前を入れてください'); return; }
      if (d.freq.type === 'weekly' && !(d.freq.days||[]).length) { toast('曜日を選んでください'); return; }
      d.def = d.def.map(x => x.trim()).filter(Boolean); delete d._new;
      put(d); draft = null; closeSheet(); toast('保存しました'); break; }
    case 'delchore':
      if (!el.dataset.sure) { el.dataset.sure = '1'; el.textContent = 'もう一度押すと削除します'; return; }
      remove(S.items[draft.id]); draft = null; closeSheet(); toast('削除しました'); break;
    case 'close': closeSheet(); break;
    case 'mv': { const cs = choresSorted(); const i = cs.findIndex(c => c.id === id), j = i + Number(el.dataset.d);
      if (j < 0 || j >= cs.length) return; [cs[i], cs[j]] = [cs[j], cs[i]];
      cs.forEach((c,k) => { if (c.order !== k) { c.order = k; c.updatedAt = Date.now(); S.items[c.id] = c; S.queue = S.queue.filter(q => q.id !== c.id); S.queue.push(c); } });
      save(); render(); push(); break; }
    case 'savenames': { const s = { ...settings(), names:{ h:$('name_h').value.trim()||'拓輝', y:$('name_y').value.trim()||'佑理' } }; put(s); toast('保存しました'); break; }
    case 'savesync': S.url = $('s_url').value.trim(); S.key = $('s_key').value.trim(); S.lastSync = 0; save(); toast('同期しています…'); sync().then(() => toast(syncState==='ok'?'同期しました':'同期できませんでした')); break;
    case 'export': { const b = new Blob([JSON.stringify(S.items,null,1)], {type:'application/json'}); const u = URL.createObjectURL(b);
      const x = document.createElement('a'); x.href = u; x.download = `uchikaji-${dayKey(Date.now())}.json`; x.click(); setTimeout(() => URL.revokeObjectURL(u), 2000); break; }
  }
});
$('scrim').addEventListener('click', closeSheet);
document.addEventListener('change', e => { if (e.target.id === 'freeboth') freeBoth = e.target.checked; });
$('mechip').addEventListener('click', () => { tab = 'settings'; render(); });
$('fab').addEventListener('click', sheetFree);
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.t; weekOff = 0; selDay = null; reviewOpen = false; closeSheet(); render(); window.scrollTo(0,0); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'freein') { doFree(e.target.value); closeSheet(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
setInterval(() => { if (!document.hidden && S.url) sync(); }, 30000);
setInterval(() => { if (tab === 'today' && !$('sheet').classList.contains('open')) render(); }, 60000);

/* ========== 起動 ========== */
if (!S.url) seedIfEmpty();
render();
if (S.url) sync();
</script>
</body>
</html>
